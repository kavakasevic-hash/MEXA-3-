<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>МЕХАНИК3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#fff;color:#000;font-family:sans-serif;font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;overscroll-behavior:none;touch-action:none;}
#main-menu{position:fixed;inset:0;background:#fff;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
#main-menu.hidden{display:none;}
#menu-logo{font-size:64px;font-weight:900;font-family:sans-serif;color:#ffb300;-webkit-text-stroke:3px #000;text-stroke:3px #000;letter-spacing:-2px;margin-bottom:48px;text-align:center;line-height:1;}
.menu-btn{width:240px;padding:18px 0;border:2.5px solid #000;background:#fff;font-size:20px;font-family:sans-serif;cursor:pointer;margin-bottom:16px;text-align:center;font-weight:normal;color:#000;}
.menu-btn:hover{background:#f5f5f5;}
#settings-menu{position:fixed;inset:0;background:#fff;z-index:2000;display:none;flex-direction:column;overflow-y:auto;}
#settings-menu.show{display:flex;}
#settings-menu-top{padding:12px 16px;border-bottom:2px solid #000;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#settings-menu-top h2{flex:1;font-size:16px;font-weight:bold;}
#settings-menu-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:13px;font-weight:bold;}
#top{background:#fff;border-bottom:2px solid #000;padding:8px 10px 6px;flex-shrink:0;}
#title{font-size:11px;font-weight:bold;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
#row-mode{display:flex;gap:8px;margin-bottom:8px;}
.big-oval{padding:7px 24px;border-radius:0;border:2px solid #000;background:#fff;color:#000;font-size:12px;font-weight:bold;cursor:pointer;}
.big-oval.active{background:#000;color:#fff;}
#row-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab-oval{padding:4px 14px;border-radius:0;border:1.5px solid #000;background:#fff;color:#000;font-size:11px;font-weight:bold;cursor:pointer;}
.tab-oval.active{background:#000;color:#fff;}
#items-panel{background:#fff;border-bottom:2px solid #000;flex-shrink:0;}
#items-scroll{display:flex;gap:5px;padding:7px 10px;overflow-x:auto;flex-wrap:wrap;max-height:110px;}
#tools-row{display:none;gap:5px;padding:7px 10px;overflow-x:hidden;overflow-y:auto;flex-wrap:wrap;max-height:180px;scrollbar-width:thin;scrollbar-color:#ccc transparent;}

#tools-row::-webkit-scrollbar{width:3px;}
#tools-row::-webkit-scrollbar-thumb{background:#ccc;border-radius:0;}
#tools-row.show{display:flex;}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 9px;border:1.5px solid #000;border-radius:0;background:#fff;cursor:pointer;min-width:46px;flex-shrink:0;}
.chip:hover{background:#f0f0f0;}
.chip.active{background:#000;color:#fff;}
.chip .ci{font-size:15px;line-height:1;}
.chip .cl{font-size:9px;font-weight:bold;color:#555;text-align:center;white-space:nowrap;}
.chip.active .cl{color:#ccc;}
#canvas-wrap{flex:1;position:relative;overflow:visible;background:#fff;touch-action:none;overscroll-behavior:none;}
#canvas-wrap.inf-map{overflow:visible;cursor:grab;}
#canvas-wrap.inf-map.panning{cursor:grabbing;}
#btn-infmap.active{background:#000;color:#fff;}
.heater-bar{width:80%;height:5px;border-radius:0;margin-top:2px;}
.acum-bar{width:80%;height:5px;border-radius:0;margin-top:2px;}
#canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
#wire-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
#night-canvas{position:absolute;top:0;left:0;pointer-events:none;display:none;z-index:20;}
.obj{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid #000;border-radius:0;background:#fff;padding:5px 3px;gap:2px;touch-action:none;overflow:hidden;}
.obj.selected{outline:2px solid #4caf50;}
.obj.act{border-color:#4caf50;border-width:2.5px;}
.obj-icon{font-size:17px;line-height:1;}
.obj-label{font-size:8px;font-weight:bold;color:#555;white-space:nowrap;}
body.tool-hand #canvas-wrap{cursor:grab;}
body.tool-hand.dragging #canvas-wrap{cursor:grabbing;}
body.tool-finger #canvas-wrap{cursor:pointer;}
body.tool-wire #canvas-wrap{cursor:crosshair;}
body.tool-trash #canvas-wrap{cursor:not-allowed;}
body.tool-glue #canvas-wrap{cursor:copy;}
body.tool-settings #canvas-wrap{cursor:help;}
body.tool-mirror #canvas-wrap{cursor:ew-resize;}
body.tool-rotate #canvas-wrap{cursor:alias;}
body.tool-resize #canvas-wrap{cursor:nwse-resize;}
body.tool-paint #canvas-wrap{cursor:cell;}
#bottombar{background:#fff;border-top:2px solid #000;padding:6px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
#status-tool{font-size:11px;font-weight:bold;}
#st-info{font-size:10px;color:#555;}
#status-msg{font-size:10px;color:#4caf50;font-weight:bold;flex:1;}
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;}
#modal-overlay.show{display:flex;}
#modal{background:#fff;border:2px solid #000;border-radius:0;padding:18px;min-width:300px;max-width:460px;max-height:85vh;overflow-y:auto;}
#modal h3{font-size:13px;font-weight:bold;margin-bottom:12px;}
#modal label{display:block;font-size:10px;font-weight:bold;color:#555;margin-bottom:4px;}
#modal input,#modal textarea,#modal select{width:100%;border:1.5px solid #000;border-radius:0;background:#fff;color:#000;padding:6px 8px;font-family:sans-serif;font-size:12px;margin-bottom:10px;outline:none;}
#modal textarea{height:80px;resize:vertical;}
.mbtn{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;}
.mbtn button{padding:6px 16px;border:1.5px solid #000;border-radius:0;background:#fff;color:#000;cursor:pointer;font-size:12px;font-weight:bold;}
.mbtn button.ok{background:#000;color:#fff;}
.file-drop{border:2px dashed #999;border-radius:0;padding:14px;text-align:center;cursor:pointer;margin-bottom:10px;font-size:11px;color:#555;}
.file-drop:hover{border-color:#000;color:#000;}
#cpf{position:fixed;top:0;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #000;border-bottom-width:2px;padding:8px 12px;z-index:600;display:none;flex-direction:row;align-items:center;gap:8px;}
#cpf.show{display:flex;}
#swatches{display:flex;flex-direction:row;gap:4px;}
.csw{width:22px;height:22px;cursor:pointer;border:1.5px solid #ccc;flex-shrink:0;}
.csw:hover{border-color:#000;}
#cust{width:28px;height:22px;border:1px solid #000;cursor:pointer;padding:0;}
/* Resize overlay */
#resize-overlay{position:fixed;inset:0;z-index:650;display:none;pointer-events:none;}
#resize-overlay.show{display:block;}
.resize-handle{position:fixed;width:18px;height:18px;background:#fff;border:2px solid #000;cursor:pointer;z-index:651;pointer-events:all;transform:translate(-50%,-50%);}
.resize-handle.h{background:#e53935;border-color:#e53935;}
.resize-handle.v{background:#1e88e5;border-color:#1e88e5;}
#resize-label{position:fixed;background:#fff;border:1.5px solid #000;padding:3px 8px;font-size:11px;font-weight:bold;z-index:652;pointer-events:none;}
.tmr-bar-wrap{width:80%;height:6px;background:#eee;border:1px solid #ccc;border-radius:0;margin-top:3px;overflow:hidden;}
.tmr-bar{height:100%;background:#000;}
#rotate-slider-panel{position:fixed;background:#fff;border:2px solid #000;border-radius:0;padding:12px;z-index:600;display:none;min-width:200px;}
#rotate-slider-panel.show{display:block;}
#rotate-slider-panel label{font-size:11px;font-weight:bold;display:block;margin-bottom:6px;}
#rot-val{font-size:11px;margin-left:8px;}

.obj.trigger-style{
  border-radius:0 !important;
  width:44px !important;
  height:44px !important;
  background:#888 !important;
  border-color:#555 !important;
  padding:0 !important;
}
.obj.trigger-style.act{
  background:#555 !important;
  border-color:#4caf50 !important;
}
.obj.trigger-style .obj-icon{font-size:20px;}
.obj.trigger-style .obj-label{font-size:8px;color:#fff;}

#lasso-rect{position:absolute;border:2px dashed #0066ff;background:rgba(0,100,255,0.05);pointer-events:none;display:none;z-index:10;}
.obj.lasso-sel{outline:2px solid #0066ff;}
#lasso-menu{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #000;border-radius:0;padding:8px 12px;display:none;z-index:700;gap:8px;flex-direction:row;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
#lasso-menu.show{display:flex;}
body.hide-text .obj-label{display:none!important;}
body.learn-mode .obj-icon{font-size:20px!important;}
body.learn-mode .obj-icon:empty::before{content:attr(data-icon);}
#lasso-menu button{padding:6px 14px;border:1.5px solid #000;border-radius:0;background:#fff;cursor:pointer;font-weight:bold;font-size:12px;color:#000;outline:none;white-space:nowrap;}
#lasso-menu button:hover{background:#f0f0f0;}
</style>
</head>
<body class="tool-hand">
<div id="fade-overlay" style="position:fixed;inset:0;background:#000;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.25s ease;"></div>

<div id="main-menu">
  <div id="menu-logo">МЕХАНИК3</div>
  <button class="menu-btn" onclick="startGame()">Играть</button>
  <button class="menu-btn" onclick="openSettingsMenu()">Настройки</button>
  <button class="menu-btn" onclick="openShopMenu()">Магазин</button>
  <button class="menu-btn" onclick="openSaveMenu()">Сохранение</button>
</div>

<div id="save-menu" style="display:none;position:fixed;inset:0;background:#fff;z-index:2000;flex-direction:column;">
  <div style="padding:12px 16px;border-bottom:2px solid #000;display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <h2 style="flex:1;font-size:16px;font-weight:bold;">Сохранение</h2>
    <button onclick="closeSaveMenu()" style="padding:6px 16px;border:1.5px solid #000;background:#fff;font-size:13px;cursor:pointer;font-weight:bold;">✕ Назад</button>
  </div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:13px;font-weight:bold;">Твой код сохранения:</div>
    <div id="save-code-display" style="font-family:monospace;font-size:14px;background:#f5f5f5;border:1.5px solid #000;padding:12px;word-break:break-all;"></div>
    <button onclick="copySaveCode()" style="padding:10px;border:1.5px solid #000;background:#000;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;">Скопировать</button>
    <div style="height:1.5px;background:#000;"></div>
    <div style="font-size:13px;font-weight:bold;">Вставь код для загрузки:</div>
    <input id="load-code-input" type="text" placeholder="Ж3=... Щ3=... + Ж2=... Щ2=..." style="font-family:monospace;font-size:13px;border:1.5px solid #000;padding:10px;width:100%;box-sizing:border-box;">
    <button onclick="loadSaveCode()" style="padding:10px;border:1.5px solid #000;background:#000;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;">Загрузить</button>
    <div id="save-msg" style="font-size:13px;font-weight:bold;color:#4caf50;min-height:20px;"></div>
  </div>
</div>

<div id="shop-menu" style="display:none;position:fixed;inset:0;background:#fff;z-index:2000;flex-direction:column;">
  <div style="padding:12px 16px;border-bottom:2px solid #000;display:flex;align-items:center;gap:10px;flex-shrink:0;">
    <h2 style="flex:1;font-size:16px;font-weight:bold;">Магазин</h2>
    <div style="display:flex;gap:12px;align-items:center;font-size:13px;font-weight:bold;">
      <span><span id="shop-gold-count">0</span> <span style="display:inline-block;width:12px;height:12px;background:#ffb300;border:1.5px solid #000;vertical-align:middle;"></span></span>
      <span><span id="shop-diamond-count">0</span> <span style="display:inline-block;width:10px;height:10px;background:#1e88e5;border:1.5px solid #000;transform:rotate(45deg);vertical-align:middle;"></span></span>
    </div>
    <button onclick="closeShopMenu()" style="padding:6px 16px;border:1.5px solid #000;background:#fff;font-size:13px;cursor:pointer;font-weight:bold;">✕ Назад</button>
  </div>
  <div id="shop-body" style="overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;"></div>
</div>

<div id="settings-menu">
  <div id="settings-menu-top">
    <h2>Настройки</h2>
    <button onclick="closeSettingsMenu()" style="padding:6px 16px;border:1.5px solid #000;background:#fff;font-size:13px;cursor:pointer;font-weight:bold;">✕ Назад</button>
  </div>
  <div id="settings-menu-body"></div>
</div>

<div id="top">
  <div id="title" style="display:flex;align-items:center;justify-content:space-between;">
    <button onclick="goToMenu()" style="background:none;border:none;font-size:18px;cursor:pointer;padding:0;color:#000;font-weight:bold;">←</button>
    <span>МЕХАНИК3</span>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
      <div style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:bold;">
        <div style="width:14px;height:14px;background:#ffb300;border:1.5px solid #000;flex-shrink:0;"></div>
        <span id="gold-count">0</span>
      </div>
      <div style="display:flex;align-items:center;gap:4px;font-size:11px;font-weight:bold;">
        <div id="diamond-icon" style="width:12px;height:12px;background:#1e88e5;border:1.5px solid #000;transform:rotate(45deg);flex-shrink:0;"></div>
        <span id="diamond-count">0</span>
      </div>
    </div>
  </div>
  <div id="row-mode">
    <button class="big-oval active" onclick="setMode('items')">Предметы</button>
    <button class="big-oval" onclick="setMode('tools')">Инструменты</button>
    <button class="big-oval" onclick="setMode('physics')">Физика</button>
    <button class="big-oval" onclick="undo()" style="padding:7px 16px;">◀</button>
    <button class="big-oval" onclick="redo()" style="padding:7px 16px;">▶</button>
  </div>
  <div id="row-tabs"></div>
</div>
<div id="test-bar" style="display:none;background:#ffb300;color:#fff;text-align:center;font-size:14px;font-weight:bold;padding:6px;letter-spacing:1px;flex-shrink:0;">Тест режим — <button onclick="exitTestMode()" style="background:#fff;color:#000;border:none;padding:3px 12px;font-weight:bold;cursor:pointer;font-size:13px;">Выйти</button></div>
<div id="items-panel">
  <div id="items-scroll"></div>
  <div id="tools-row"></div>
  <div id="physics-panel" style="display:none;padding:8px 10px;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:2px solid #000;">
    <button onclick="setPhysBrush('water')" id="pb-water" class="big-oval">Вода</button>
    <button onclick="setPhysBrush('sand')" id="pb-sand" class="big-oval">Песок</button>
    <button onclick="clearPhys()" class="big-oval">Очистить</button>
  </div>
</div>
<div id="canvas-wrap">
  <div id="lasso-rect"></div>
  <div id="lasso-menu"><button onclick="lassoMove()">Переместить</button><button onclick="lassoCopy()">Копировать</button><button onclick="lassoDelete()">Удалить</button><button onclick="lassoClose()">X</button></div>
  <svg id="wire-svg"></svg>
  <div id="canvas"></div>
  <canvas id="night-canvas"></canvas>
  <canvas id="phys-canvas" style="position:absolute;top:0;left:0;z-index:16;display:none;image-rendering:pixelated;pointer-events:none;"></canvas>
</div>
<div id="bottombar">
  <span id="status-tool">Рука</span>
  <span id="st-info">Объектов: <b id="st-obj">0</b> &nbsp; Проводов: <b id="st-wir">0</b></span>
  <span id="status-msg"></span>
</div>
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">Настройки</h3>
    <div id="modal-body"></div>
    <div class="mbtn">
      <button onclick="hideModal()">Отмена</button>
      <button class="ok" id="modal-ok">OK</button>
    </div>
  </div>
</div>
<div id="cpf"><div id="swatches"></div><input type="color" id="cust"></div>
<div id="resize-overlay">
  <div class="resize-handle h" id="rh-left"></div>
  <div class="resize-handle h" id="rh-right"></div>
  <div class="resize-handle v" id="rh-top"></div>
  <div class="resize-handle v" id="rh-bottom"></div>
  <div id="resize-label"></div>
</div>
<div id="fps-counter" style="display:none;position:fixed;bottom:36px;right:8px;background:#000;color:#0f0;font-size:10px;font-family:monospace;padding:2px 6px;z-index:999;">0 FPS</div>
<div id="rotate-slider-panel">
  <label>Угол: <span id="rot-val">0°</span></label>
  <input type="range" id="rot-slider" min="0" max="360" value="0" style="width:100%">
</div>

function zoom(delta){
  zoomLevel=Math.max(0.2,Math.min(4,zoomLevel+delta));
  applyZoom();
}
function zoomReset(){
  zoomLevel=1;applyZoom();
}
function applyZoom(){
  const canvas=document.getElementById('canvas');
  const svg=document.getElementById('wire-svg');
  const t=`translate(${mapOffX}px,${mapOffY}px) scale(${zoomLevel})`;
  canvas.style.transform=t;
  canvas.style.transformOrigin='0 0';
  svg.style.transform=t;
  svg.style.transformOrigin='0 0';
  document.getElementById('wire-svg').setAttribute('width',document.getElementById('canvas-wrap').clientWidth/zoomLevel);
  document.getElementById('wire-svg').setAttribute('height',document.getElementById('canvas-wrap').clientHeight/zoomLevel);
}

function lassoClose(){
  lassoSelected.forEach(id=>{var _el1=document.getElementById('obj-'+id);if(_el1)_el1.classList.remove('lasso-sel');});
  lassoSelected=[];
  document.getElementById('lasso-rect').style.display='none';
  document.getElementById('lasso-menu').classList.remove('show');
}
function lassoMove(){
  document.getElementById('lasso-menu').classList.remove('show');
  lassoActive='move';
  setMsg('Тяни выделенные объекты');
  const wrap=document.getElementById('canvas-wrap');
  let startX=0,startY=0,moving=false;
  const startOffsets={};
  lassoSelected.forEach(id=>{
    const o=objects.find(x=>x.id===id);
    if(o) startOffsets[id]={x:o.x,y:o.y};
  });
  function onDown(e){
    moving=true;
    startX=e.clientX;startY=e.clientY;
    e.preventDefault();
  }
  function onMove(e){
    if(!moving)return;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    lassoSelected.forEach(id=>{
      const o=objects.find(x=>x.id===id);
      if(!o||!startOffsets[id])return;
      o.x=startOffsets[id].x+dx;
      o.y=startOffsets[id].y+dy;
      const el=document.getElementById('obj-'+o.id);
      if(el){el.style.left=o.x+'px';el.style.top=o.y+'px';}
    });
    redrawWires();
  }
  function onUp(){
    if(!moving)return;
    moving=false;
    wrap.removeEventListener('pointerdown',onDown);
    document.removeEventListener('pointermove',onMove);
    document.removeEventListener('pointerup',onUp);
    lassoClose();
    setMsg('');
    saveH();
  }
  wrap.addEventListener('pointerdown',onDown);
  document.addEventListener('pointermove',onMove);
  document.addEventListener('pointerup',onUp);
}
function lassoCopy(){
  saveH();
  const newIds=[];
  lassoSelected.forEach(id=>{
    const o=objects.find(x=>x.id===id);if(!o)return;
    const clone={...o,id:nextId++,x:o.x+30,y:o.y+30,meta:{...o.meta},_gox:0,_goy:0};
    objects.push(clone);renderObj(clone);
    newIds.push(clone.id);
  });
  updateSt();
  lassoClose();
  lassoSelected=newIds;
  newIds.forEach(function(id){var _e=document.getElementById('obj-'+id);if(_e)_e.classList.add('lasso-sel');});
  document.getElementById('lasso-menu').classList.add('show');
  setMsg('Скопировано — теперь перемести');
}

function setupLasso(){
  const wrap=document.getElementById('canvas-wrap');
  const rect=document.getElementById('lasso-rect');
  let lx0=0,ly0=0,lDragOffsets={};
  wrap.addEventListener('pointerdown',e=>{
    if(tool!=='lasso')return;
    if(e.target===wrap||e.target===document.getElementById('canvas')){
      lassoClose();
      const r=wrap.getBoundingClientRect();
      lx0=e.clientX-r.left;ly0=e.clientY-r.top;
      rect.style.cssText=`display:block;left:${lx0}px;top:${ly0}px;width:0;height:0;`;
      lassoActive='draw';
      e.preventDefault();
    }
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(lassoActive==='draw'){
      const r=wrap.getBoundingClientRect();
      const cx=e.clientX-r.left,cy=e.clientY-r.top;
      const x=Math.min(lx0,cx),y=Math.min(ly0,cy),w=Math.abs(cx-lx0),h=Math.abs(cy-ly0);
      rect.style.left=x+'px';rect.style.top=y+'px';rect.style.width=w+'px';rect.style.height=h+'px';
    }
  });
  document.addEventListener('pointerup',e=>{
    if(lassoActive==='draw'){
      lassoActive=false;
      const r=wrap.getBoundingClientRect();
      const rx=parseFloat(rect.style.left),ry=parseFloat(rect.style.top);
      const rw=parseFloat(rect.style.width),rh=parseFloat(rect.style.height);
      if(rw<5&&rh<5){rect.style.display='none';return;}
      lassoSelected=objects.filter(o=>{
        return o.x+o.w>rx&&o.x<rx+rw&&o.y+o.h>ry&&o.y<ry+rh;
      }).map(o=>o.id);
      lassoSelected.forEach(function(id){var _e=document.getElementById('obj-'+id);if(_e)_e.classList.add('lasso-sel');});
      if(lassoSelected.length>0){
        document.getElementById('lasso-menu').classList.add('show');
      }else{rect.style.display='none';}
    }
  });
}

function setupInfMap(){
  const wrap=document.getElementById('canvas-wrap');
  wrap.addEventListener('pointerdown',e=>{
    if(!infMap||tool!=='finger')return;
    if(e.target!==wrap&&e.target!==document.getElementById('canvas')&&e.target!==document.getElementById('wire-svg'))return;
    mapPanning=true;mapPanStartX=e.clientX-mapOffX;mapPanStartY=e.clientY-mapOffY;
    wrap.classList.add('panning');
    e.preventDefault();
  },{passive:false});
  // Закрываем resize и paint при клике на пустой холст
  wrap.addEventListener('pointerdown',e=>{
    if(e.target===wrap||e.target===document.getElementById('canvas')){
      if(resizeTarget)closeResize();
      if(paintTarget){paintTarget=null;document.getElementById('cpf').classList.remove('show');}
    }
  });
  document.addEventListener('pointermove',e=>{
    if(!mapPanning)return;
    mapOffX=e.clientX-mapPanStartX;mapOffY=e.clientY-mapPanStartY;
    applyZoom();
  });
  document.addEventListener('pointerup',()=>{
    if(mapPanning){mapPanning=false;document.getElementById('canvas-wrap').classList.remove('panning');}
  });
}

// Коды инструментов и их логика (True если заканчивается на цифру = запятая значит есть)
var TOOL_CODES={
  paint:'1Щ', glue:'5Б', resize:'1О', lasso:'Н7',
  mirror:'Ж6', rotate:'ЛД', settings:'Н5',
  night:'99', test:'К4'
};
function toolCodeEndsDigit(code){var c=code[code.length-1];return c>='0'&&c<='9';}
function encodeSave(){
  var parts=[];
  Object.keys(TOOL_CODES).forEach(function(id){
    var code=TOOL_CODES[id];
    var bought=id==='night'||id==='test'?unlockedSpecial[id]:unlockedTools[id];
    var endsDigit=toolCodeEndsDigit(code);
    // endsDigit: запятая=есть, точка=нет
    // endsBukva: запятая=нет, точка=есть
    var sep;
    if(endsDigit) sep=bought?',':'.';
    else sep=bought?'.':',';
    parts.push(code+sep);
  });
  var g=gold,d=diamond;
  return 'Ж3='+(g+1)+' Щ3='+(g-1)+' + Ж2='+(d+1)+' Щ2='+(d-1)+' + '+parts.join('');
}
function decodeSave(input){
  // Парсим валюту
  var m=input.match(/Ж3=(-?\d+)\s+Щ3=(-?\d+)\s*\+\s*Ж2=(-?\d+)\s*Щ2=(-?\d+)/);
  if(!m)return null;
  var j3=parseInt(m[1]),sh3=parseInt(m[2]),j2=parseInt(m[3]),sh2=parseInt(m[4]);
  if(j3-sh3!==2||j2-sh2!==2)return null;
  var newGold=j3-1,newDiamond=j2-1;
  if(newGold<0||newDiamond<0)return null;
  // Парсим инструменты
  var toolPart=input.split(/\+\s*Ж2/)[0].split(/\+\s*Ж3/)[0];
  // берём всё после второго +
  var plusParts=input.split('+');
  if(plusParts.length<3)return null;
  var toolStr=plusParts.slice(2).join('+');
  var newTools={};
  var newSpecial={};
  Object.keys(TOOL_CODES).forEach(function(id){
    var code=TOOL_CODES[id];
    var endsDigit=toolCodeEndsDigit(code);
    // ищем code+ запятую или точку
        var regComma=new RegExp(code+'[,]');
        var regDot=new RegExp(code+'[.]');
    var hasComma=regComma.test(toolStr);
    var hasDot=regDot.test(toolStr);
    var bought;
    if(endsDigit) bought=hasComma; // запятая=есть
    else bought=hasDot; // точка=есть
    if(id==='night'||id==='test') newSpecial[id]=bought;
    else newTools[id]=bought;
  });
  return {gold:newGold,diamond:newDiamond,tools:newTools,special:newSpecial};
}
function copySaveCode(){
  var code=document.getElementById('save-code-display').textContent;
  if(navigator.clipboard){
    navigator.clipboard.writeText(code).then(function(){
      document.getElementById('save-msg').textContent='Скопировано!';
      document.getElementById('save-msg').style.color='#4caf50';
    });
  }else{
    var ta=document.createElement('textarea');
    ta.value=code;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    document.getElementById('save-msg').textContent='Скопировано!';
    document.getElementById('save-msg').style.color='#4caf50';
  }
}
function loadSaveCode(){
  var input=document.getElementById('load-code-input').value.trim();
  var msg=document.getElementById('save-msg');
  var result=decodeSave(input);
  if(!result){msg.textContent='Неверный или повреждённый код!';msg.style.color='#e53935';return;}
  gold=result.gold;diamond=result.diamond;
  Object.keys(result.tools).forEach(function(id){unlockedTools[id]=result.tools[id];});
  Object.keys(result.special).forEach(function(id){unlockedSpecial[id]=result.special[id];});
  updateCurrency();
  buildTools();
  msg.textContent='Загружено! Золото: '+gold+', Алмазы: '+diamond;
  msg.style.color='#4caf50';
  document.getElementById('save-code-display').textContent=encodeSave();
}

function buyItem(item){
  var can=item.currency==='gold'?gold>=item.price:diamond>=item.price;
  if(!can){
    var b=document.getElementById('shop-body');
    var m=document.createElement('div');
    m.style.cssText='color:#e53935;font-weight:bold;font-size:13px;padding:6px 0;';
    m.textContent='Недостаточно '+(item.currency==='gold'?'золота':'алмазов')+'!';
    b.insertBefore(m,b.firstChild);
    setTimeout(function(){if(m.parentNode)m.parentNode.removeChild(m);},2000);
    return;
  }
  if(item.currency==='gold') gold-=item.price;
  else diamond-=item.price;
  if(item.special) unlockedSpecial[item.id]=true;
  else unlockedTools[item.id]=true;
  updateCurrency();
  document.getElementById('shop-gold-count').textContent=gold;
  document.getElementById('shop-diamond-count').textContent=diamond;
  buildShopBody();
  buildTools();
}
function addSpawnCount(n){
  if(testMode)return; // в тест режиме не считаем
  n=n||1;
  totalSpawned+=n;
  // Золото за каждые 10
  const newGold=Math.floor(totalSpawned/goldThreshold);
  if(newGold>gold){gold=newGold;updateCurrency();}
  // Алмаз за каждые 100
  const newDiamond=Math.floor(totalSpawned/diamondThreshold);
  if(newDiamond>diamond){diamond=newDiamond;updateCurrency();}
}

}

    inner=`<div class="obj-icon" style="filter:${frozen?'grayscale(1)':'none'}"></div>
      <div class="obj-label" style="color:${frozen?'#aaa':tc}">COOLING ${frozen?'ЗАМОРОЖЕН':cold.toFixed(0)+'%'}</div>
      <div class="heater-bar" style="background:#eee;"><div style="width:${cold}%;height:100%;background:${ccol};border-radius:0;"></div></div>`;
  }else if(t==='ROB_FWD'||t==='ROB_BCK'||t==='ROB_L'||t==='ROB_R'||t==='ROB_BIG'||t==='ROB_SML'){
    const robIcons={'ROB_FWD':'⬆','ROB_BCK':'⬇','ROB_L':'⬅','ROB_R':'➡','ROB_BIG':'⊕','ROB_SML':'⊖'};
    inner=`<div class="obj-icon" style="color:${o.active?'#4caf50':tc};font-size:20px;">${robIcons[t]}</div><div class="obj-label" style="color:${dc}">${o.label}</div>`;
  }else if(t==='TRIG_DELETE'||t==='TRIG_SPAWN'||t==='TRIG_CLONE'){
    const trigIcons={'TRIG_DELETE':'🗑','TRIG_SPAWN':'📦','TRIG_CLONE':'🧬'};
    inner=`<div class="obj-icon" style="font-size:18px;">${trigIcons[t]}</div><div class="obj-label" style="color:${dc}">${t==='TRIG_DELETE'?'DELETE':t==='TRIG_SPAWN'?'SPAWN':'CLONE'}</div>`;
  }else{
    inner=`<div class="obj-icon" style="color:${tc}"></div><div class="obj-label" style="color:${dc}">${o.label}</div>`;
  }
  el.innerHTML=inner;
  // Режим обучения — добавляем иконку через data-icon
  if(learnMode){
    const icon=LEARN_ICONS[o.type]||'';
    const iconEl=el.querySelector('.obj-icon');
    if(iconEl&&icon&&!iconEl.textContent.trim()) iconEl.textContent=icon;
    // Заменяем текстовую метку на русское название
    const learnLabel=LEARN_LABELS[o.type];
    if(learnLabel){
      const labels=el.querySelectorAll('.obj-label');
      if(labels.length>0&&labels[0].textContent){
        // Только первую метку — это название типа
        const first=labels[0];
        // Не трогаем метки которые показывают состояние (ON/OFF/цифры)
        const txt=first.textContent.trim();
        if(txt&&!/^\d/.test(txt)&&txt!=='ON'&&txt!=='OFF'&&txt!=='RUN'){
          first.textContent=learnLabel;
        }
      }
    }
  }
  if(t==='JOYSTICK') setTimeout(()=>setupJoystick(o),0);
  applyMedia(o);
  if(nightMode)drawNight();
}

function applyMedia(o){
  const t=o.type;
  if(t==='PLR_MP3'&&o.meta.src){
    let aud=document.getElementById('aud-'+o.id);
    if(!aud){
      aud=document.createElement('audio');
      aud.id='aud-'+o.id;
      aud.loop=true;
      aud.style.display='none';
      document.body.appendChild(aud);
    }
    if(aud.getAttribute('data-fname')!==o.meta.fname){
      aud.src=o.meta.src;
      aud.setAttribute('data-fname',o.meta.fname||'');
      aud.load();
    }
    if(o.active){
      aud.play().catch(e=>{console.warn('audio play failed:',e);});
    }else{
      aud.pause();
      aud.currentTime=0;
    }
  }
  if(t==='PLR_MP4'&&o.meta.src){
    let vid=document.getElementById('vid-'+o.id);
    if(!vid){
      vid=document.createElement('video');
      vid.id='vid-'+o.id;
      vid.loop=true;
      vid.setAttribute('playsinline','');
      vid.controls=true;
      vid.style.cssText='position:fixed;bottom:10px;right:10px;width:280px;height:160px;z-index:999;border:2px solid #000;border-radius:0;background:#000;display:none;';
      document.body.appendChild(vid);
    }
    if(vid.getAttribute('data-fname')!==o.meta.fname){
      vid.src=o.meta.src;
      vid.setAttribute('data-fname',o.meta.fname||'');
      vid.load();
    }
    if(o.active){
      vid.style.display='block';
      vid.play().catch(e=>{vid.muted=true;vid.play().catch(()=>{});});
    }else{
      vid.style.display='none';
      vid.pause();
      vid.currentTime=0;
    }
  }
}

function startMotor(o){
  if(motorAnims[o.id])return;
  const dir=(o.meta.motorDir==='left')?-1:1;
  const speed=(o.meta.motorSpeed||2)*dir;
  let lastTime=0;
  function tick(ts){
    const oo=objects.find(x=>x.id===o.id);
    if(!oo||!oo.active){stopMotor(o.id);return;}
    if(ts-lastTime<33){motorAnims[o.id]=requestAnimationFrame(tick);return;}
    lastTime=ts;
    oo.rotation=((oo.rotation||0)+speed+360)%360;
    const el=document.getElementById('obj-'+oo.id);
    if(el) el.style.transform=`rotate(${oo.rotation}deg) scaleX(${oo.flipped?-1:1})`;
    const ccx=oo.x+oo.w/2,ccy=oo.y+oo.h/2;
    glueGroups.forEach(g=>{
      if(!g.includes(oo.id))return;
      g.forEach(id=>{
        if(id===oo.id)return;
        const o2=objects.find(x=>x.id===id);if(!o2)return;
        const rad=speed*Math.PI/180;
        const ox=o2.x+o2.w/2-ccx,oy=o2.y+o2.h/2-ccy;
        o2.x=ccx+(ox*Math.cos(rad)-oy*Math.sin(rad))-o2.w/2;
        o2.y=ccy+(ox*Math.sin(rad)+oy*Math.cos(rad))-o2.h/2;
        o2._gox=o2.x-oo.x;o2._goy=o2.y-oo.y;
        const e2=document.getElementById('obj-'+id);
        if(e2){e2.style.left=o2.x+'px';e2.style.top=o2.y+'px';}
      });
    });
    motorAnims[o.id]=requestAnimationFrame(tick);
  }
  motorAnims[o.id]=requestAnimationFrame(tick);
}
function stopMotor(id){
  if(motorAnims[id]){
    if(typeof motorAnims[id]==='number') cancelAnimationFrame(motorAnims[id]);
    delete motorAnims[id];
  }
}

function startInfd(o){
  if(infdTimers[o.id])return;
  const interval=o.meta.infdInterval||500;
  infdTimers[o.id]=setInterval(()=>{
    const oo=objects.find(x=>x.id===o.id);
    if(!oo){clearInterval(infdTimers[o.id]);delete infdTimers[o.id];return;}
    oo.active=!oo.active;renderObj(oo);propagate(oo);redrawWires();
  },interval);
}
function stopInfd(id){if(infdTimers[id]){clearInterval(infdTimers[id]);delete infdTimers[id];}}

function syncIMP(imp){
  const outIds=wires.filter(w=>w.from===imp.id).map(w=>w.to);
  if(outIds.length===0)return;
  const anyOn=outIds.some(id=>{const s=objects.find(x=>x.id===id);return s&&s.active;});
  if(anyOn){
    outIds.forEach(id=>{
      const dst=objects.find(x=>x.id===id);
      if(dst&&!dst.active){dst.active=true;renderObj(dst);propagate(dst);}
    });
  }
}
function checkIMPs(){
  objects.filter(o=>o.type==='IMP').forEach(imp=>syncIMP(imp));
}
function checkCameras(){
  objects.filter(o=>o.type==='CAM').forEach(cam=>{
    const r=cam.meta.radius||100;
    const cx=cam.x+cam.w/2,cy=cam.y+cam.h/2;
    const sq=document.getElementById('camSq-'+cam.id);
    if(sq){sq.style.left=(cx-r)+'px';sq.style.top=(cy-r)+'px';}
    const inView=objects.filter(o2=>{
      if(o2.id===cam.id||o2.type==='CAM'||o2.type==='CAM_OUT')return false;
      return o2.x+o2.w>cx-r&&o2.x<cx+r&&o2.y+o2.h>cy-r&&o2.y<cy+r;
    });
    const out=objects.find(o=>o.type==='CAM_OUT'&&o.meta.camId===cam.meta.camId);
    if(!out)return;
    const inner=document.getElementById('camout-inner-'+out.id);
    if(!inner)return;
    inner.innerHTML='';
    if(inView.length===0){inner.innerHTML='<div style="color:#555;font-size:9px;padding:4px;">нет объектов</div>';return;}
    inView.forEach(o2=>{
      const el=document.getElementById('obj-'+o2.id);if(!el)return;
      const scaleX=(out.w-8)/(r*2);const scaleY=(out.h-8)/(r*2);
      const px=Math.round((o2.x-(cx-r))*scaleX);
      const py=Math.round((o2.y-(cy-r))*scaleY);
      const pw=Math.max(10,Math.round(o2.w*scaleX));
      const ph=Math.max(10,Math.round(o2.h*scaleY));
      const mini=document.createElement('div');
      mini.style.cssText=`position:absolute;left:${px}px;top:${py}px;width:${pw}px;height:${ph}px;background:${o2.color||'#fff'};border:1px solid ${o2.borderColor||'#000'};border-radius:0;display:flex;align-items:center;justify-content:center;font-size:${Math.max(8,Math.round(14*Math.min(scaleX,scaleY)))}px;overflow:hidden;`;
      mini.textContent=o2.icon||o2.label.slice(0,2);
      inner.appendChild(mini);
    });
  });
}

function checkPortals(){
  const pairs={};
  objects.filter(o=>o.type==='TP1'||o.type==='TP2').forEach(tp=>{
    if(!pairs[tp.meta.tpPairId])pairs[tp.meta.tpPairId]={};
    pairs[tp.meta.tpPairId][tp.type]=tp;
  });
  Object.values(pairs).forEach(p=>{
    const tp1=p['TP1'],tp2=p['TP2'];
    if(!tp1||!tp2)return;
    objects.forEach(o=>{
      if(o.type==='TP1'||o.type==='TP2')return;
      const inTP1=o.x+o.w>tp1.x&&o.x<tp1.x+tp1.w&&o.y+o.h>tp1.y&&o.y<tp1.y+tp1.h;
      const inTP2=o.x+o.w>tp2.x&&o.x<tp2.x+tp2.w&&o.y+o.h>tp2.y&&o.y<tp2.y+tp2.h;
      if(inTP1&&!o._inPortal){
        o._inPortal=true;
        o.x=tp2.x+tp2.w+4;o.y=tp2.y;
        const el=document.getElementById('obj-'+o.id);
        if(el){el.style.left=o.x+'px';el.style.top=o.y+'px';}
        redrawWires();
        setTimeout(()=>{if(o)delete o._inPortal;},500);
      }else if(inTP2&&!o._inPortal){
        o._inPortal=true;
        o.x=tp1.x+tp1.w+4;o.y=tp1.y;
        const el=document.getElementById('obj-'+o.id);
        if(el){el.style.left=o.x+'px';el.style.top=o.y+'px';}
        redrawWires();
        setTimeout(()=>{if(o)delete o._inPortal;},500);
      }
    });
  });
}

function applyTrigger(trigger){
  const targets=wires.filter(w=>w.from===trigger.id).map(w=>objects.find(o=>o.id===w.to)).filter(Boolean);
  const t=trigger.type;
  const animate=trigger.meta.animate===true;
  const dur=trigger.meta.animDuration||400;
  const cycle=trigger.meta.cycle===true;

  if(triggerCycles[trigger.id]){clearInterval(triggerCycles[trigger.id]);delete triggerCycles[trigger.id];}

  function getMoveDelta(px){
    const dir=trigger.meta.moveDir||'right';
    if(dir==='right') return {dx:px,dy:0};
    if(dir==='left')  return {dx:-px,dy:0};
    if(dir==='up')    return {dx:0,dy:-px};
    if(dir==='down')  return {dx:0,dy:px};
    if(dir==='both_h') return {dx:px,dy:0};
    if(dir==='both_v') return {dx:0,dy:px};
    return {dx:px,dy:0};
  }

  function doStep(forward){
    targets.forEach(obj=>{
      const el=document.getElementById('obj-'+obj.id);if(!el)return;
      const sign=forward?1:-1;

      if(t==='ALPHA'){
        const a=trigger.meta.alphaVal!=null?trigger.meta.alphaVal:0.5;
        const target=forward?a:1;
        if(animate){el.style.transition=`opacity ${dur}ms ease`;el.style.opacity=String(target);}
        else el.style.opacity=String(target);
      }else if(t==='ROTATE_T'){
        const deg=(trigger.meta.rotateDeg||90)*sign;
        obj.rotation=(obj.rotation||0)+deg;
        if(animate){el.style.transition=`transform ${dur}ms ease`;}
        el.style.transform=`rotate(${obj.rotation}deg) scaleX(${obj.flipped?-1:1})`;
        if(animate)setTimeout(()=>{el.style.transition='';},dur);
      }else if(t==='COLOR_T'){
        const col=forward?(trigger.meta.targetColor||'#ff0000'):(obj._origColor||'#fff');
        if(forward)obj._origColor=obj.color;
        obj.color=col;obj.borderColor=isLight(col)?'#000':'#fff';
        renderObj(obj);
      }else if(t==='MOVE'){
        const px=(trigger.meta.movePx||20)*sign;
        const {dx,dy}=getMoveDelta(px);
        if(animate){el.style.transition=`left ${dur}ms ease,top ${dur}ms ease`;}
        obj.x+=dx;obj.y+=dy;
        el.style.left=obj.x+'px';el.style.top=obj.y+'px';
        if(animate)setTimeout(()=>{el.style.transition='';redrawWires();},dur);
        else redrawWires();
      }else if(t==='BM'){
        const scale=forward?(trigger.meta.bmScale||1.2):(1/(trigger.meta.bmScale||1.2));
        obj.w=Math.max(20,Math.round(obj.w*scale));obj.h=Math.max(16,Math.round(obj.h*scale));
        if(animate){el.style.transition=`width ${dur}ms ease,height ${dur}ms ease`;el.style.width=obj.w+'px';el.style.height=obj.h+'px';setTimeout(()=>{el.style.transition='';redrawWires();},dur);}
        else{renderObj(obj);redrawWires();}
      }else if(t==='BIG_T'){
        const px=(trigger.meta.bigPx||10)*sign;
        obj.w=Math.max(20,obj.w+px);obj.h=Math.max(16,obj.h+px);
        if(animate){el.style.transition=`width ${dur}ms ease,height ${dur}ms ease`;el.style.width=obj.w+'px';el.style.height=obj.h+'px';setTimeout(()=>{el.style.transition='';},dur);}
        else{renderObj(obj);}
        redrawWires();
      }else if(t==='MINI_T'){
        const px=(trigger.meta.miniPx||10)*sign;
        obj.w=Math.max(20,obj.w-px);obj.h=Math.max(16,obj.h-px);
        if(animate){el.style.transition=`width ${dur}ms ease,height ${dur}ms ease`;el.style.width=obj.w+'px';el.style.height=obj.h+'px';setTimeout(()=>{el.style.transition='';},dur);}
        else{renderObj(obj);}
        redrawWires();
      }else if(t==='BG'){
        const wrap=document.getElementById('canvas-wrap');
        const bgc=forward?(trigger.meta.bgColor||'#fff'):'#fff';
        if(animate){wrap.style.transition=`background ${dur}ms ease`;wrap.style.background=bgc;setTimeout(()=>{wrap.style.transition='';},dur);}
        else wrap.style.background=bgc;
      }
    });

    if(t==='TRIG_DELETE'){
      targets.forEach(obj=>{delObj(obj.id);});
    }else if(t==='TRIG_CLONE'){
      targets.forEach(obj=>{
        const clone={...obj,id:nextId++,x:obj.x+20,y:obj.y+20,meta:{...obj.meta},_gox:0,_goy:0};
        objects.push(clone);renderObj(clone);updateSt();addSpawnCount(1);
      });
    }else if(t==='TRIG_SPAWN'){
      const spawnDef=ALL_ITEMS_FLAT.find(x=>x.id===trigger.meta.spawnType);
      if(spawnDef){
        const sx=trigger.meta.spawnX||100,sy=trigger.meta.spawnY||100;
        const no={id:nextId++,type:spawnDef.id,label:spawnDef.label,icon:spawnDef.icon||'',
          x:sx,y:sy,w:80,h:68,active:false,color:'#fff',borderColor:'#000',
          flipped:false,rotation:0,meta:{},_gox:0,_goy:0};
        objects.push(no);renderObj(no);updateSt();addSpawnCount(1);
      }
    }
  }

  if(cycle){
    let forward=true;
    doStep(forward);
    const interval=animate?(dur*2+50):(200);
    triggerCycles[trigger.id]=setInterval(()=>{
      const tr=objects.find(x=>x.id===trigger.id);
      if(!tr||!tr.active){clearInterval(triggerCycles[trigger.id]);delete triggerCycles[trigger.id];return;}
      forward=!forward;
      doStep(forward);
    },interval);
  }else{
    doStep(true);
  }
}

function setupJoystick(o){
  const el=document.getElementById('obj-'+o.id);if(!el)return;
  const base=el.querySelector('div[style*="border-radius:50%"]');
  const stick=document.getElementById('jstick-'+o.id);
  if(!base||!stick)return;
  let active=false;
  const handleMove=(cx,cy)=>{
    const rect=base.getBoundingClientRect();
    const bx=rect.left+rect.width/2,by=rect.top+rect.height/2;
    const dx=cx-bx,dy=cy-by;
    const maxR=rect.width/2-11;
    const dist=Math.hypot(dx,dy);
    const angle=Math.atan2(dy,dx);
    const r=Math.min(dist,maxR);
    stick.style.transform=`translate(calc(-50% + ${Math.round(r*Math.cos(angle))}px), calc(-50% + ${Math.round(r*Math.sin(angle))}px))`;
    const robots=wires.filter(w=>w.from===o.id).map(w=>objects.find(x=>x.id===w.to)).filter(x=>x&&x.type==='ROBOT');
    const THRESH=8;
    robots.forEach(robot=>{
      if(Math.abs(dx)>Math.abs(dy)){
        if(dx>THRESH)handleRobotCmd(robot,'ROB_R',true);
        else if(dx<-THRESH)handleRobotCmd(robot,'ROB_L',true);
      }else{
        if(dy>THRESH)handleRobotCmd(robot,'ROB_BCK',true);
        else if(dy<-THRESH)handleRobotCmd(robot,'ROB_FWD',true);
      }
    });
  };
  base.addEventListener('pointerdown',e=>{active=true;base.setPointerCapture(e.pointerId);handleMove(e.clientX,e.clientY);e.stopPropagation();});
  base.addEventListener('pointermove',e=>{if(active)handleMove(e.clientX,e.clientY);e.stopPropagation();});
  base.addEventListener('pointerup',()=>{active=false;stick.style.transform='translate(-50%,-50%)';});
}

function checkTech(){
  // SOLAR: активируется автоматически по дню/ночи
  objects.filter(o=>o.type==='SOLAR').forEach(sol=>{
    const mode=sol.meta.solarMode||'day';
    const shouldBeOn=(mode==='day'&&!nightMode)||(mode==='night'&&nightMode);
    if(shouldBeOn!==sol.active){
      sol.active=shouldBeOn;
      renderObj(sol);
      propagate(sol);
      redrawWires();
    }
  });
  objects.filter(o=>o.type==='ACUM').forEach(acum=>{
    if(acum.meta.charge==null) acum.meta.charge=100;
    const drainInterval=acum.meta.drainInterval||2;
    const chargeInterval=acum.meta.chargeInterval||3;
    if(acum.active){
      acum.meta._drainTick=(acum.meta._drainTick||0)+1;
      if(acum.meta._drainTick>=drainInterval){
        acum.meta._drainTick=0;
        acum.meta.charge=Math.max(0,acum.meta.charge-1);
        if(acum.meta.charge<=0){acum.active=false;propagate(acum);}
      }
    }
    const chargers=wires.filter(w=>w.to===acum.id).map(w=>objects.find(o=>o.id===w.from)).filter(o=>o&&o.type==='CHARGER'&&o.active);
    if(chargers.length>0&&acum.meta.charge<100){
      acum.meta._chargeTick=(acum.meta._chargeTick||0)+1;
      if(acum.meta._chargeTick>=chargeInterval){
        acum.meta._chargeTick=0;
        acum.meta.charge=Math.min(100,acum.meta.charge+1);
      }
    }
    renderObj(acum);
  });

  objects.filter(o=>o.type==='HEATER').forEach(h=>{
    if(h.meta.heat==null)h.meta.heat=0;
    const speed=h.meta.heatSpeed||2;
    const wasActive=h.active;
    const coolers=wires.filter(w=>w.to===h.id).map(w=>objects.find(o=>o.id===w.from)).filter(o=>o&&o.type==='COOLING'&&o.active);
    if(coolers.length>0) h.meta.heat=Math.max(0,h.meta.heat-coolers.length*3);
    if(h.active&&h.meta.heat<100){
      h.meta.heat=Math.min(100,h.meta.heat+speed);
      if(h.meta.heat>=100){
        h.active=false;
        propagate(h);
      } else {
        wires.filter(w=>w.from===h.id).forEach(w=>{
          const dst=objects.find(o=>o.id===w.to);
          if(dst&&!dst.active){dst.active=true;renderObj(dst);propagate(dst);}
        });
      }
    } else if(!h.active&&h.meta.heat>0&&h.meta.heat<100){
      h.meta.heat=Math.max(0,h.meta.heat-1);
    }
    renderObj(h);
    redrawWires();
  });

  objects.filter(o=>o.type==='COOLING').forEach(co=>{
    if(co.meta.cold==null)co.meta.cold=0;
    if(co.active&&co.meta.cold<100){
      co.meta.cold=Math.min(100,co.meta.cold+(co.meta.coolSpeed||2));
      if(co.meta.cold>=100){co.active=false;propagate(co);}
    }else if(!co.active&&co.meta.cold>0){
      co.meta.cold=Math.max(0,co.meta.cold-1);
    }
    renderObj(co);
  });
}

function checkFunnels(){
  objects.filter(o=>o.type==='FUNNEL').forEach(fun=>{
    const toDelete=[];
    objects.forEach(o2=>{
      if(o2.id===fun.id||o2.type==='FUNNEL')return;
      if(o2.x<fun.x+fun.w&&o2.x+o2.w>fun.x&&o2.y<fun.y+fun.h&&o2.y+o2.h>fun.y)toDelete.push(o2.id);
    });
    toDelete.forEach(id=>delObj(id));
  });
}
function checkSensors(){
  objects.filter(o=>o.type==='SENSOR').forEach(sen=>{
    const touching=objects.some(o2=>{
      if(o2.id===sen.id||o2.type==='SENSOR')return false;
      return o2.x<sen.x+sen.w&&o2.x+o2.w>sen.x&&o2.y<sen.y+sen.h&&o2.y+o2.h>sen.y;
    });
    if(touching!==sen.active){sen.active=touching;renderObj(sen);propagate(sen);redrawWires();}
  });
}

function enterTestMode(){
  if(testMode)return;
  testMode=true;
  // Сохраняем снапшот текущего состояния
  testSnapshot=JSON.stringify({objects:objects.map(o=>({...o,meta:{...o.meta}})),wires:[...wires]});
  // Жёлтый заголовок и полоса
  document.getElementById('title').style.color='#ffb300';
  document.getElementById('test-bar').style.display='block';
  const btn=document.getElementById('btn-test');

function exitTestMode(){
  if(!testMode)return;
  testMode=false;
  // Откатываем к снапшоту
  if(testSnapshot){
    const d=JSON.parse(testSnapshot);
    document.getElementById('canvas').innerHTML='';
    document.getElementById('wire-svg').innerHTML='';
    Object.keys(timers).forEach(id=>{clearInterval(timers[id]);delete timers[id];});
    Object.keys(robotAnims).forEach(id=>{clearInterval(robotAnims[id]);delete robotAnims[id];});
    Object.keys(motorAnims).forEach(id=>{clearInterval(motorAnims[id]);delete motorAnims[id];});
    Object.keys(infdTimers).forEach(id=>{clearInterval(infdTimers[id]);delete infdTimers[id];});
    Object.keys(delayTimers).forEach(id=>{clearTimeout(delayTimers[id]);delete delayTimers[id];});
    objects=d.objects;wires=d.wires;
    nextId=Math.max(nextId,...objects.map(o=>o.id+1),...wires.map(w=>w.id+1),1);
    objects.forEach(o=>renderObj(o));
    redrawWires();updateSt();
    testSnapshot=null;
  }
  // Убираем жёлтый стиль
  document.getElementById('title').style.color='';
  document.getElementById('test-bar').style.display='none';
  const btn=document.getElementById('btn-test');
  if(btn){btn.style.background='#fff';btn.style.color='#000';}

}

let _fpsFrames=0,_fpsLast=performance.now();
function toggleFPS(){
  const el=document.getElementById('fps-counter');
  if(fpsVisible){
    el.style.display='block';
    if(!fpsInterval){
      fpsInterval=setInterval(()=>{
        const now=performance.now();
        const fps=Math.round(_fpsFrames*1000/(now-_fpsLast));
        el.textContent=fps+' FPS';
        _fpsFrames=0;_fpsLast=now;
      },500);
    }
    // Count frames via requestAnimationFrame
    function countFrame(){_fpsFrames++;if(fpsVisible)requestAnimationFrame(countFrame);}
    requestAnimationFrame(countFrame);
  }else{
    el.style.display='none';
    if(fpsInterval){clearInterval(fpsInterval);fpsInterval=null;}
  }
}

// ===== ПИКСЕЛЬНАЯ ФИЗИКА =====
var PHYS_SCALE=4; // 1 пиксель симуляции = 4px экрана
var physGrid=null,physW=0,physH=0;
var physRunning=false,physRAF=null,physPouring=false;
var physBrush='water',physBrushSize=3;
var EMPTY=0,WALL=1,WATER=2,SAND=3,FIRE=4,SMOKE=5;// fire removed
var COLORS=['','#555','#1e88e5','#ffb300','#e53935','#aaa'];

function initPhys(){
  var wrap=document.getElementById('canvas-wrap');
  var pc=document.getElementById('phys-canvas');
  physW=Math.floor(wrap.clientWidth/PHYS_SCALE);
  physH=Math.floor(wrap.clientHeight/PHYS_SCALE);
  pc.width=physW;pc.height=physH;
  pc.style.width=wrap.clientWidth+'px';
  pc.style.height=wrap.clientHeight+'px';
  pc.style.display='block';
  pc.style.pointerEvents='all';
  physGrid=new Uint8Array(physW*physH);
  // Заблокировать блоки объектов в сетку
  syncBlocksToGrid();
  // Обработка рисования
  pc.addEventListener('pointerdown',function(e){
    if(mode!=='physics')return;
    physPouring=true;
    physDraw(e);
    pc.setPointerCapture(e.pointerId);
  });
  pc.addEventListener('pointermove',function(e){if(physPouring)physDraw(e);});
  pc.addEventListener('pointerup',function(){physPouring=false;});
  pc.addEventListener('pointercancel',function(){physPouring=false;});
}

function syncBlocksToGrid(){
  if(!physGrid)return;
  // Строим маску блоков отдельно чтобы не портить сетку
  for(var i=0;i<physGrid.length;i++){
    if(physGrid[i]===WALL)physGrid[i]=EMPTY;
  }
  objects.forEach(function(o){
    var gx=Math.floor((o.x*zoomLevel+mapOffX)/PHYS_SCALE);
    var gy=Math.floor((o.y*zoomLevel+mapOffY)/PHYS_SCALE);
    var gw=Math.ceil((o.w*zoomLevel)/PHYS_SCALE);
    var gh=Math.ceil((o.h*zoomLevel)/PHYS_SCALE);
    for(var y=gy;y<gy+gh&&y<physH;y++){
      for(var x=gx;x<gx+gw&&x<physW;x++){
        if(x>=0&&y>=0&&physGrid[y*physW+x]===EMPTY){
          physGrid[y*physW+x]=WALL;
        }
      }
    }
  });
}

function physDraw(e){
  var pc=document.getElementById('phys-canvas');
  var r=pc.getBoundingClientRect();
  var cx=Math.floor((e.clientX-r.left)/PHYS_SCALE);
  var cy=Math.floor((e.clientY-r.top)/PHYS_SCALE);
  var type=physBrush==='wall'?WALL:physBrush==='water'?WATER:physBrush==='sand'?SAND:FIRE;
  for(var dy=-physBrushSize;dy<=physBrushSize;dy++){
    for(var dx=-physBrushSize;dx<=physBrushSize;dx++){
      var nx=cx+dx,ny=cy+dy;
      if(nx>=0&&nx<physW&&ny>=0&&ny<physH){
        if(physGrid[ny*physW+nx]!==WALL||type===WALL||type===EMPTY){
          physGrid[ny*physW+nx]=type;
        }
      }
    }
  }
}

function stepPhys(){
  if(!physGrid)return;
  var g=physGrid,W=physW,H=physH;
  // Случайный порядок по x чтобы не было смещения
  var updated=new Uint8Array(W*H);

  for(var y=H-2;y>=0;y--){
    var xStart=Math.random()>0.5?0:W-1;
    var xEnd=xStart===0?W:-1;
    var xStep=xStart===0?1:-1;
    for(var x=xStart;x!==xEnd;x+=xStep){
      var i=y*W+x;
      var cell=g[i];
      if(cell===EMPTY||cell===WALL||updated[i])continue;

      if(cell===SAND){
        // Падает вниз
        var below=(y+1)*W+x;
        if(y+1<H&&g[below]===EMPTY){g[i]=EMPTY;g[below]=SAND;updated[below]=1;}
        else if(y+1<H&&(g[below]===WATER)){
          // Тонет в воде
          var t=g[below];g[below]=SAND;g[i]=t;updated[below]=1;
        } else {
          var dl=(y+1)*W+(x-1),dr=(y+1)*W+(x+1);
          var goL=x>0&&g[dl]===EMPTY,goR=x<W-1&&g[dr]===EMPTY;
          if(goL&&goR) {var side=Math.random()>0.5?dl:dr;g[i]=EMPTY;g[side]=SAND;updated[side]=1;}
          else if(goL){g[i]=EMPTY;g[dl]=SAND;updated[dl]=1;}
          else if(goR){g[i]=EMPTY;g[dr]=SAND;updated[dr]=1;}
        }
      } else if(cell===WATER){
        var bw=(y+1)*W+x;
        if(y+1<H&&g[bw]===EMPTY){g[i]=EMPTY;g[bw]=WATER;updated[bw]=1;}
        else {
          var spread=Math.floor(Math.random()*3)+1;
          var wl=y*W+(x-spread),wr=y*W+(x+spread);
          var gl=x-spread>=0&&g[wl]===EMPTY,gr=x+spread<W&&g[wr]===EMPTY;
          if(gl&&gr){var ws=Math.random()>0.5?wl:wr;g[i]=EMPTY;g[ws]=WATER;updated[ws]=1;}
          else if(gl){g[i]=EMPTY;g[wl]=WATER;updated[wl]=1;}
          else if(gr){g[i]=EMPTY;g[wr]=WATER;updated[wr]=1;}
        }
      }
    }
  }
}

function renderPhys(){
  if(!physGrid)return;
  var pc=document.getElementById('phys-canvas');
  var ctx=pc.getContext('2d');
  var img=ctx.createImageData(physW,physH);
  var d=img.data;
  var hexToRgb=function(hex){
    var r=parseInt(hex.slice(1,3),16),g2=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return[r,g2,b];
  };
  var palette=[
    [0,0,0,0],         // EMPTY
    [0,0,0,0],         // WALL
    [30,136,229,200],  // WATER
    [255,179,0,255],   // SAND
    [0,0,0,0],         // FIRE - рисуется отдельно
    [80,80,80,60]      // SMOKE
  ];

  for(var i=0;i<physW*physH;i++){
    var c=palette[physGrid[i]]||palette[0];
    d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=c[3];
  }
  ctx.putImageData(img,0,0);
}

function physLoop(){
  if(!physRunning)return;
  // Синхронизируем размер только если поменялся
  var wrap=document.getElementById('canvas-wrap');
  var pc=document.getElementById('phys-canvas');
  if(pc&&wrap){
    var ww=wrap.clientWidth,wh=wrap.clientHeight;
    if(pc.style.width!==ww+'px'){
      pc.style.width=ww+'px';pc.style.height=wh+'px';
    }
  }
  syncBlocksToGrid();
  stepPhys();
  renderPhys();
  physRAF=requestAnimationFrame(physLoop);
}

function setPhysBrush(b){
  physBrush=b;
  ['wall','water','sand','fire'].forEach(function(t){
    var btn=document.getElementById('pb-'+t);
    if(btn)btn.classList.toggle('active',t===b);
  });
}

function clearPhys(){
  if(!physGrid)return;
  for(var i=0;i<physGrid.length;i++){
    if(physGrid[i]!==WALL)physGrid[i]=EMPTY;
  }
}

function startPhysics(){
  var pp=document.getElementById('physics-panel');
  if(pp)pp.style.display='flex';
  if(!physGrid)initPhys();
  else{
    var pc=document.getElementById('phys-canvas');
    if(pc){pc.style.display='block';pc.style.pointerEvents='all';}
  }
  physRunning=true;
  setPhysBrush(physBrush);
  if(!physRAF)physRAF=requestAnimationFrame(physLoop);
}

function stopPhysics(){
  var pc=document.getElementById('phys-canvas');
  // Не останавливаем симуляцию - просто отключаем ввод
  if(pc)pc.style.pointerEvents='none';
}

    tom:function(){var o=ac.createOscillator();o.frequency.setValueAtTime(200,ac.currentTime);o.frequency.exponentialRampToValueAtTime(50,ac.currentTime+0.2);var g=ac.createGain();g.gain.setValueAtTime(0.5,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.2);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+0.2);},
    clap:function(){var b=ac.createBuffer(1,ac.sampleRate*0.1,ac.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;var s=ac.createBufferSource();s.buffer=b;var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1000;var g=ac.createGain();g.gain.setValueAtTime(0.45,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.1);s.connect(f);f.connect(g);g.connect(ac.destination);s.start();},
    noise:function(){var b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;var s=ac.createBufferSource();s.buffer=b;var g=ac.createGain();g.gain.value=0.15;s.connect(g);g.connect(ac.destination);s.start();s.stop(ac.currentTime+1);},
