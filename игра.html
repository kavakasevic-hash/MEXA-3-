function toggleNight(){
  nightMode=!nightMode;
  const btn=document.getElementById('btn-night');
  if(nightMode){
    btn.style.background='#000';
    btn.style.color='#fff';
    btn.textContent='День';
    drawNight();
  }else{
    const nc=document.getElementById('night-canvas');
    if(nc)nc.style.display='none';
    btn.style.background='#fff';
    btn.style.color='#000';
    btn.textContent='Ночь';
  }
  // SOLAR реагирует мгновенно
  checkTech();
}

function drawNight(){
  if(!nightMode)return;
  const wrap=document.getElementById('canvas-wrap');
  const nc=document.getElementById('night-canvas');
  const ww=wrap.clientWidth,wh=wrap.clientHeight;
  // Только меняем размер если изменился
  if(nc.width!==ww||nc.height!==wh){nc.width=ww;nc.height=wh;}
  nc.style.width=ww+'px';nc.style.height=wh+'px';
  nc.style.display='block';

  const ctx=nc.getContext('2d');
  ctx.clearRect(0,0,ww,wh);

  // Полупрозрачный тёмный фон — чуть-чуть видно что происходит
  ctx.fillStyle='rgba(0,0,20,0.82)';
  ctx.fillRect(0,0,ww,wh);

  // Активные лампы дают круг света
  const lamps=objects.filter(o=>o.type==='LAMP'&&o.active);
  lamps.forEach(o=>{
    const cx=(o.x+o.w/2)*zoomLevel+mapOffX;
    const cy=(o.y+o.h/2)*zoomLevel+mapOffY;
    const r=Math.max(o.w,o.h)*1.5*zoomLevel;
    // Вырезаем круг через destination-out
    const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    grad.addColorStop(0,'rgba(0,0,0,1)');
    grad.addColorStop(0.75,'rgba(0,0,0,0.9)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalCompositeOperation='destination-out';
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  });
}

function setupPointer(){
  // Блокируем свайп вниз только на канвасе, не трогаем панели со скроллом
  const canvasWrap=document.getElementById('canvas-wrap');
  canvasWrap.addEventListener('touchmove', function(e){
    e.preventDefault();
  }, {passive: false});
  document.addEventListener('pointermove',e=>{
    if(!dragObj)return;e.preventDefault();
    const r=document.getElementById('canvas').getBoundingClientRect();
    const nx=Math.max(0,e.clientX-r.left-dragOx);
    const ny=Math.max(0,e.clientY-r.top-dragOy);
    if(!didDrag&&Math.abs(nx-dragObj.x)<dragThreshold&&Math.abs(ny-dragObj.y)<dragThreshold)return;
    dragObj.x=nx;dragObj.y=ny;
    didDrag=true;moveGlued(dragObj);
    const el=document.getElementById('obj-'+dragObj.id);
    if(el){el.style.left=dragObj.x+'px';el.style.top=dragObj.y+'px';}
    redrawWires();
    if(nightMode)drawNight();
  },{passive:false});
  document.addEventListener('pointerup',e=>{
    dragObj=null;document.body.classList.remove('dragging');
  });
  document.addEventListener('pointercancel',()=>{dragObj=null;});
}
function moveGlued(src){
  glueGroups.forEach(g=>{
    if(!g.includes(src.id))return;
    g.forEach(id=>{
      if(id===src.id)return;
      const oo=objects.find(x=>x.id===id);if(!oo)return;
      oo.x=src.x+(oo._gox||0);
      oo.y=src.y+(oo._goy||0);
      const el=document.getElementById('obj-'+id);
      if(el){el.style.left=oo.x+'px';el.style.top=oo.y+'px';}
    });
  });
}

function onDown(e,o){
  if(e.button!==0&&e.pointerType==='mouse')return;
  if((tool==='finger'||tool==='hand')&&(o.type==='SPST_NO'||o.type==='SPST_NC')){
    e.stopPropagation();e.preventDefault();
    pressSpst(o);
    return;
  }
  if(tool==='hand'){
    e.stopPropagation();e.preventDefault();
    saveH();dragObj=o;didDrag=false;
    const r=document.getElementById('canvas').getBoundingClientRect();
    dragOx=e.clientX-r.left-o.x;dragOy=e.clientY-r.top-o.y;
    document.body.classList.add('dragging');
    try{e.target.setPointerCapture(e.pointerId);}catch(ex){}
  }
}
function onUp(e,o){
  if(o.type==='SPST_NO'||o.type==='SPST_NC'){
    releaseSpst(o);
  }
}

function pressSpst(o){
  if(spstHeld[o.id])return;
  spstHeld[o.id]=true;
  if(o.type==='SPST_NO'){
    o.active=true;
  }else{
    o.active=true;
  }
  renderObj(o);
  const signal=o.type==='SPST_NO'?true:false;
  wires.filter(w=>w.from===o.id).forEach(w=>{
    const dst=objects.find(x=>x.id===w.to);if(!dst)return;
    recv(dst,o,signal);
  });
  redrawWires();
}
function releaseSpst(o){
  if(!spstHeld[o.id])return;
  delete spstHeld[o.id];
  o.active=false;
  renderObj(o);
  const signal=o.type==='SPST_NO'?false:true;
  wires.filter(w=>w.from===o.id).forEach(w=>{
    const dst=objects.find(x=>x.id===w.to);if(!dst)return;
    recv(dst,o,signal);
  });
  redrawWires();
}

function onClick(e,o){
  if(tool==='hand'&&didDrag){didDrag=false;return;}
  e.stopPropagation();
  if(tool==='trash'){saveH();delObj(o.id);return;}
  if(tool==='wire'){handleWire(o);return;}
  if(tool==='glue'){handleGlue(o);return;}
  if(tool==='resize'){openResize(o);return;}
  if(tool==='paint'){openPaint(o,e);return;}
  if(tool==='settings'){openSettings(o);return;}
  if(tool==='mirror'){saveH();o.flipped=!o.flipped;renderObj(o);return;}
  if(tool==='rotate'){openRotate(o,e);return;}
  if(tool==='scissors')return;
  if(o.type==='SPST_NO'||o.type==='SPST_NC')return;
  if(tool==='finger'||tool==='hand')activate(o);
}

function activate(o){
  const t=o.type;
  if(t==='BLOCK'||t==='SENSOR'||t==='CHAM'||t==='FUNNEL'||t==='SPST_NO'||t==='SPST_NC'||t==='IMP'||t==='IMP1'||t==='IMP2')return;
  if(t==='COUNTER'){saveH();o.meta.count=0;o.active=false;renderObj(o);setMsg('Счётчик сброшен');setTimeout(()=>setMsg(''),1000);return;}
  if(t==='INFD'){
    saveH();
    if(infdTimers[o.id]){stopInfd(o.id);o.active=false;renderObj(o);redrawWires();}
    else startInfd(o);
    return;
  }
  if(t==='TMR'){
    saveH();
    if(timers[o.id]){clearInterval(timers[o.id]);delete timers[o.id];o.meta.progress=0;o.active=false;renderObj(o);redrawWires();return;}
    const dur=(o.meta.duration||3)*1000,start=Date.now();
    o.active=true;renderObj(o);redrawWires();
    timers[o.id]=setInterval(()=>{
      const oo=objects.find(x=>x.id===o.id);if(!oo){clearInterval(timers[o.id]);delete timers[o.id];return;}
      const el=Date.now()-start;
      oo.meta.progress=Math.min(100,(el/dur)*100);
      const bar=document.getElementById('tbar-'+oo.id);if(bar)bar.style.width=oo.meta.progress+'%';
      if(el>=dur){clearInterval(timers[oo.id]);delete timers[oo.id];oo.meta.progress=0;oo.active=false;propagatePulse(oo);renderObj(oo);redrawWires();}
    },50);
    return;
  }
  if(t==='RND'){
    saveH();
    const outs=wires.filter(w=>w.from===o.id);if(!outs.length)return;
    outs.forEach(w=>{const d=objects.find(x=>x.id===w.to);if(d){d.active=false;renderObj(d);propagate(d);}});
    const pick=outs[Math.floor(Math.random()*outs.length)];
    const picked=objects.find(x=>x.id===pick.to);
    if(picked){picked.active=true;renderObj(picked);propagate(picked);}
    redrawWires();
    setTimeout(()=>{outs.forEach(w=>{const d=objects.find(x=>x.id===w.to);if(d){d.active=false;renderObj(d);propagate(d);}});redrawWires();},900);
    return;
  }
  const isPulse=t==='TG'||t.startsWith('RU_')||t.startsWith('EN_')||t.startsWith('KEY_')||
    t.startsWith('ROB_')||t.startsWith('NUM_')||t.startsWith('SGN_');
  if(!isPulse&&!['AB','AND','OR','XOR1','XOR2','NAND','NOT','BUFFER','SYNC','DSYN'].includes(t))return;
  saveH();
  if(isPulse){
    o.active=true;renderObj(o);propagate(o);redrawWires();
    setTimeout(()=>{o.active=false;renderObj(o);redrawWires();propagate(o);},800);
  }else if(t==='XOR1'){
    o.active=!o.active;
    renderObj(o);propagate(o);redrawWires();
  }else if(t==='SYNC'){
    o.active=!o.active;
    if(o.active){
      const btnTypes=['AND','OR','NOT','XOR1','XOR2','NAND','NOR','XNOR','TG','RND','BUFFER','INFD'];
      objects.filter(x=>btnTypes.includes(x.type)&&x.id!==o.id).forEach(x=>{x.active=true;renderObj(x);propagate(x);});
    }
    renderObj(o);redrawWires();
  }else if(t==='DSYN'){
    o.active=!o.active;
    if(o.active){
      objects.filter(x=>x.active&&x.id!==o.id).forEach(x=>{x.active=false;renderObj(x);propagate(x);});
    }
    renderObj(o);redrawWires();
  }else if(t==='BUFFER'){
    o.active=!o.active;
    propagate(o);renderObj(o);redrawWires();
  }else if(t==='NOT'){
    o.active=!o.active;renderObj(o);
    wires.filter(w=>w.from===o.id).forEach(w=>{
      const dst=objects.find(x=>x.id===w.to);if(!dst)return;
      dst.active=!o.active;renderObj(dst);propagate(dst);
    });
    redrawWires();
  }else{
    if(t==='AB'){o.meta.s=o.meta.s==='B'?'A':'B';o.active=o.meta.s==='A';}
    else o.active=!o.active;
    propagate(o);renderObj(o);redrawWires();
  }
}

function propagatePulse(src){
  wires.filter(w=>w.from===src.id).forEach(w=>{
    const dst=objects.find(o=>o.id===w.to);if(!dst)return;
    dst.active=true;renderObj(dst);propagate(dst);redrawWires();
    setTimeout(()=>{dst.active=false;renderObj(dst);propagate(dst);redrawWires();},800);
  });
}
function propagate(src){
  wires.filter(w=>w.from===src.id).forEach(w=>{
    const dst=objects.find(o=>o.id===w.to);if(dst)recv(dst,src,src.active);
  });
}

const BUTTON_TYPES=['TG','AND','OR','NOT','XOR1','XOR2','NAND','BUFFER','AB','RND','INFD','SPST_NO','SPST_NC','SYNC','DSYN'];
const KEY_TYPES=t=>(t.startsWith('RU_')||t.startsWith('EN_')||t.startsWith('KEY_')||t.startsWith('ROB_')||t.startsWith('NUM_')||t.startsWith('SGN_'));

function recv(o,src,val){
  if(!o.meta.inp)o.meta.inp={};
  o.meta.inp[src.id]=val;
  const ins=Object.values(o.meta.inp);const t=o.type;
  const wasActive=o.active;

  const isKeyType=KEY_TYPES(t);
  if((BUTTON_TYPES.includes(t)||isKeyType)&&val){
    if(!o.active){
      o.active=true;renderObj(o);propagate(o);redrawWires();
      setTimeout(()=>{
        const oo=objects.find(x=>x.id===o.id);
        if(!oo)return;
        if(t==='AB'||t==='INFD')return;
        oo.active=false;renderObj(oo);propagate(oo);redrawWires();
      },800);
    }
    return;
  }

  if(t==='COUNTER'){
    if(val&&!wasActive){
      o.meta.count=(o.meta.count||0)+1;
      const max=o.meta.max||10;
      if(o.meta.count>=max){
        o.active=true;
        propagatePulse(o);
        if(o.meta.reset!==false) o.meta.count=0;
      }
      renderObj(o);redrawWires();
    }
    return;
  }

  if(['MOVE','ALPHA','ROTATE_T','COLOR_T','BM','BIG_T','MINI_T','BG','TRIG_DELETE','TRIG_SPAWN','TRIG_CLONE'].includes(t)){
    o.active=ins.some(v=>v);
    if(o.active){applyTrigger(o);}
    else if(triggerCycles[o.id]){clearInterval(triggerCycles[o.id]);delete triggerCycles[o.id];}
    renderObj(o);redrawWires();return;
  }

  if(t==='ROBOT'){handleRobotCmd(o,src.type,val);return;}
  if(t==='SPEED'){
    o.active=ins.some(v=>v);
    if(o.active){
      wires.filter(w=>w.from===o.id).forEach(w=>{
        const dst=objects.find(x=>x.id===w.to);
        if(dst&&dst.type==='ROBOT') dst.meta.customSpeed=o.meta.robotSpeed||ROBOT_STEP;
      });
    }
    renderObj(o);redrawWires();return;
  }
  if(t==='FAN'){
    const wasOn=o.active;
    o.active=ins.some(v=>v);
    if(o.active&&!wasOn) startFan(o);
    else if(!o.active&&wasOn) stopFan(o.id);
    renderObj(o);redrawWires();return;
  }
  if(t==='PXR'){
    const wasOn=o.active;
    o.active=ins.some(v=>v);
    if(o.active&&!wasOn) startPXR(o);       // активация → толкаем
    else if(!o.active&&wasOn) pullBackPXR(o.id); // деактивация → тянем обратно
    renderObj(o);redrawWires();return;
  }
  if(t==='PISTON'){
    o.active=ins.some(v=>v);
    if(o.active&&!wasActive)doPistonPush(o,false);
    else if(!o.active&&wasActive)doPistonRetract(o,false);
    renderObj(o);redrawWires();return;
  }
  if(t==='STICKY_PISTON'){
    o.active=ins.some(v=>v);
    if(o.active&&!wasActive)doPistonPush(o,true);
    else if(!o.active&&wasActive)doPistonRetract(o,true);
    renderObj(o);redrawWires();return;
  }
  if(t==='MOTOR'){
    o.active=ins.some(v=>v);
    if(o.active)startMotor(o);else stopMotor(o.id);
    renderObj(o);redrawWires();return;
  }
  if(t==='DELAY'){
    const newVal=ins.some(function(v){return v;});
    if(newVal===o.active)return;
    const ms=o.meta.delayMs||500;
    if(delayTimers[o.id]){clearTimeout(delayTimers[o.id]);delete delayTimers[o.id];}
    o.meta.delayPending=true;renderObj(o);
    delayTimers[o.id]=setTimeout(function(){
      delete delayTimers[o.id];
      const oo=objects.find(function(x){return x.id===o.id;});
      if(!oo)return;
      oo.active=newVal;oo.meta.delayPending=false;
      renderObj(oo);propagate(oo);redrawWires();
    },ms);
    return;
  }
  if(t==='FF_SET'){
    if(val&&!wasActive){
      // SET — включить, найти RST партнёра и синхронизировать состояние
      const ffId=o.meta.ffId;
      o.meta.ffState=true;o.active=true;renderObj(o);propagate(o);
      const rst=objects.find(function(x){return x.type==='FF_RST'&&x.meta.ffId===ffId;});
      if(rst){rst.meta.ffState=true;renderObj(rst);}
      redrawWires();
    }
    return;
  }
  if(t==='FF_RST'){
    if(val&&!wasActive){
      // RESET — выключить
      const ffId=o.meta.ffId;
      o.meta.ffState=false;o.active=false;renderObj(o);
      const set=objects.find(function(x){return x.type==='FF_SET'&&x.meta.ffId===ffId;});
      if(set){set.meta.ffState=false;set.active=false;renderObj(set);propagate(set);}
      redrawWires();
    }
    return;
  }
  if(t==='BOOMBOX'){
    o.active=ins.some(function(v){return v;});
    if(val&&!wasActive&&o.meta.boomSound){
      playMechSound(o.meta.boomSound);
    }
    renderObj(o);redrawWires();return;
  }
  if(t==='PIANO'){
    o.active=ins.some(function(v){return v;});
    if(val&&!wasActive&&o.meta.pianoNote){
      playMechNote(parseFloat(o.meta.pianoNote));
    }
    renderObj(o);redrawWires();return;
  }
  if(t==='EJECTOR'){if(val&&!wasActive)doEject(o);o.active=val;renderObj(o);redrawWires();return;}
  if(t==='CHAM'){
    o.active=ins.some(v=>v);
    if(val&&src){
      // копируем цвет блока-источника
      const srcColor=src.color||'#fff';
      o.meta.chamColor=srcColor;
    }
    // цвет НЕ сбрасывается при деактивации — CHAM запоминает цвет
    renderObj(o);propagate(o);redrawWires();return;
  }
  if(t==='NOT'){
    o.active=val;
    wires.filter(w=>w.from===o.id).forEach(w=>{
      const dst=objects.find(x=>x.id===w.to);if(!dst)return;
      dst.active=!val;renderObj(dst);propagate(dst);
    });
    renderObj(o);redrawWires();return;
  }
  if(t==='XOR2'){
    const allInputIds=wires.filter(w=>w.to===o.id).map(w=>w.from);
    const onCount=allInputIds.filter(id=>{
      const src=objects.find(x=>x.id===id);
      return src&&src.active;
    }).length;
    o.active=onCount===1;
    renderObj(o);propagate(o);redrawWires();return;
  }
  else if(t==='ACUM'){
    o.active=(o.meta.charge||0)>0&&ins.some(v=>v);
    renderObj(o);propagate(o);redrawWires();return;
  }
  else if(t==='CHARGER'){
    o.active=ins.some(v=>v);renderObj(o);redrawWires();return;
  }
  else if(t==='HEATER'){
    const wasActive=o.active;
    o.active=ins.some(v=>v)&&(o.meta.heat||0)<100;
    if(!wasActive&&o.active){
      wires.filter(w=>w.from===o.id).forEach(w=>{
        const dst=objects.find(x=>x.id===w.to);
        if(dst){dst.active=true;renderObj(dst);propagate(dst);}
      });
    }
    renderObj(o);redrawWires();return;
  }
  else if(t==='COOLING'){
    o.active=ins.some(v=>v);renderObj(o);redrawWires();return;
  }
  else if(t==='AND'){
    const allSrcIds=wires.filter(w=>w.to===o.id).map(w=>w.from);
    if(allSrcIds.length===0){o.active=false;}
    else o.active=allSrcIds.every(id=>{const s=objects.find(x=>x.id===id);return s&&s.active;});
  }
  else if(t==='OR') o.active=ins.some(v=>v);
  else if(t==='NOR'){
    const srcIds=wires.filter(w=>w.to===o.id).map(w=>w.from);
    const anyOn=srcIds.some(id=>{const s=objects.find(x=>x.id===id);return s&&s.active;});
    o.active=srcIds.length>0&&!anyOn;
    renderObj(o);propagate(o);redrawWires();return;
  }
  else if(t==='XNOR'){
    const srcIds=wires.filter(w=>w.to===o.id).map(w=>w.from);
    if(srcIds.length===0){o.active=false;renderObj(o);propagate(o);redrawWires();return;}
    const activeSrcs=srcIds.map(id=>objects.find(x=>x.id===id)).filter(Boolean).filter(s=>s.active);
    if(activeSrcs.length===0){o.active=false;renderObj(o);propagate(o);redrawWires();return;}
    const types=activeSrcs.map(s=>s.type);
    const allSameType=types.every(t2=>t2===types[0]);
    o.active=allSameType&&activeSrcs.length>=2;
    renderObj(o);propagate(o);redrawWires();return;
  }
  else if(t==='BUFFER'){
    o.active=val;
  }
  else if(t==='IMP'){
    o.active=ins.some(v=>v);
    syncIMP(o);
    renderObj(o);redrawWires();return;
  }
  else if(t.match(/^IMP\d+$/)){
    o.active=ins.some(v=>v);
    if(o.meta.pairId){
      const siblings=objects.filter(x=>x.id!==o.id&&x.meta.pairId===o.meta.pairId&&x.type.match(/^IMP\d+$/));
      siblings.forEach(sib=>{sib.active=o.active;renderObj(sib);propagate(sib);});
    }
  }
  else if(t==='SYNC'){
    o.active=ins.some(v=>v);
    if(o.active){
      const btnTypes=['AND','OR','NOT','XOR1','XOR2','NAND','NOR','XNOR','TG','RND','BUFFER','INFD','SPST_NO','SPST_NC'];
      objects.filter(x=>btnTypes.includes(x.type)&&x.id!==o.id).forEach(x=>{
        x.active=true;renderObj(x);propagate(x);
      });
    }
    redrawWires();return;
  }
  else if(t==='DSYN'){
    o.active=ins.some(v=>v);
    if(o.active){
      objects.filter(x=>x.active&&x.id!==o.id).forEach(x=>{
        x.active=false;renderObj(x);propagate(x);
      });
    }
    redrawWires();return;
  }
  else if(t==='NAND'){
    const allSrcIds=wires.filter(w=>w.to===o.id).map(w=>w.from);
    if(allSrcIds.length===0){o.active=true;}
    else o.active=!allSrcIds.every(id=>{const s=objects.find(x=>x.id===id);return s&&s.active;});
  }
  else if(['LAMP','PLR_MP3','PLR_MP4','PLR_IMG','PLR_PDF','PLR_TXT'].includes(t)){
    const allSrcIds=wires.filter(w=>w.to===o.id).map(w=>w.from);
    if(allSrcIds.length===0){o.active=false;}
    else{
      const xor1Ids=allSrcIds.filter(id=>{const s=objects.find(x=>x.id===id);return s&&s.type==='XOR1';});
      const andIds=allSrcIds.filter(id=>{const s=objects.find(x=>x.id===id);return s&&s.type==='AND';});
      const nandIds=allSrcIds.filter(id=>{const s=objects.find(x=>x.id===id);return s&&s.type==='NAND';});
      const otherIds=allSrcIds.filter(id=>!xor1Ids.includes(id)&&!andIds.includes(id)&&!nandIds.includes(id));
      const xorActive=xor1Ids.length>0&&xor1Ids.filter(id=>{const s=objects.find(x=>x.id===id);return s&&s.active;}).length%2===1;
      const andActive=andIds.length>0&&andIds.every(id=>{const s=objects.find(x=>x.id===id);return s&&s.active;});
      const nandActive=nandIds.length>0&&!nandIds.every(id=>{const s=objects.find(x=>x.id===id);return s&&s.active;});
      const otherActive=otherIds.some(id=>{const s=objects.find(x=>x.id===id);return s&&s.active;});
      o.active=xorActive||andActive||nandActive||otherActive;
    }
  }
  else if(t==='SCREEN_TXT'&&val){
    if(src.type==='KEY_NL')o.meta.text=(o.meta.text||'')+'\n';
    else if(src.type==='KEY_SPC')o.meta.text=(o.meta.text||'')+' ';
    else if(src.type==='KEY_CAP')o.meta.caps=!o.meta.caps;
    else if(src.icon&&src.icon.length===1)o.meta.text=(o.meta.text||'')+(o.meta.caps?src.icon.toUpperCase():src.icon.toLowerCase());
  }
  renderObj(o);propagate(o);redrawWires();
}

let fanAnims={};

function startFan(o){
  if(fanAnims[o.id])return;
  const dir=o.meta.fanDir||'right';
  const spd=o.meta.fanSpeed||1;
  // px за тик (каждые 30мс)
  const step=spd*0.5;

  fanAnims[o.id]=setInterval(()=>{
    const fan=objects.find(x=>x.id===o.id);
    if(!fan||!fan.active){stopFan(o.id);return;}

    // Находим объекты перед вентилятором
    const targets=getObjectsInFront(fan);
    if(targets.length===0)return;

    targets.forEach(obj=>{
      if(dir==='right') obj.x+=step;
      else if(dir==='left') obj.x-=step;
      else if(dir==='down') obj.y+=step;
      else if(dir==='up') obj.y-=step;
      obj.x=Math.max(0,obj.x);
      obj.y=Math.max(0,obj.y);
      const el=document.getElementById('obj-'+obj.id);
      if(el){el.style.left=obj.x+'px';el.style.top=obj.y+'px';}
      moveGlued(obj);
    });
    redrawWires();
    if(nightMode)drawNight();
  },30);
}

function stopFan(id){
  if(fanAnims[id]){clearInterval(fanAnims[id]);delete fanAnims[id];}
}

let pxrAnims={};

function startPXR(o){
  if(pxrAnims[o.id])return;
  const dir=o.meta.fanDir||'right';
  const step=Math.max(0.5,(o.meta.fanSpeed||1)*0.5);

  // Запоминаем стартовые позиции чтобы потом вернуть
  const targetIds=getObjectsInFront(o).map(x=>x.id);
  if(targetIds.length===0)return;
  const startPos={};
  targetIds.forEach(id=>{
    const obj=objects.find(x=>x.id===id);
    if(obj) startPos[id]={x:obj.x,y:obj.y};
  });
  // Сохраняем стартовые позиции в мета чтобы pullBack мог их использовать
  o.meta.pxrTargetIds=targetIds;
  o.meta.pxrStartPos=startPos;
  o.meta.pxrPhase='push';

  let lastTime=0;
  function tick(ts){
    const pxr=objects.find(x=>x.id===o.id);
    if(!pxr||!pxr.active||!pxrAnims[o.id]){
      // сигнал пропал во время толкания — остановить
      if(pxrAnims[o.id]){cancelAnimationFrame(pxrAnims[o.id]);delete pxrAnims[o.id];}
      return;
    }
    if(ts-lastTime<33){pxrAnims[o.id]=requestAnimationFrame(tick);return;}
    lastTime=ts;

    targetIds.forEach(id=>{
      const cur=objects.find(x=>x.id===id);if(!cur)return;
      if(dir==='right') cur.x+=step;
      else if(dir==='left') cur.x-=step;
      else if(dir==='down') cur.y+=step;
      else if(dir==='up') cur.y-=step;
      cur.x=Math.max(0,cur.x);cur.y=Math.max(0,cur.y);
      const el=document.getElementById('obj-'+id);
      if(el){el.style.left=cur.x+'px';el.style.top=cur.y+'px';}
    });
    pxrAnims[o.id]=requestAnimationFrame(tick);
  }
  pxrAnims[o.id]=requestAnimationFrame(tick);
}

function pullBackPXR(id){
  // Останавливаем толкание если ещё идёт
  if(pxrAnims[id]){cancelAnimationFrame(pxrAnims[id]);delete pxrAnims[id];}

  const o=objects.find(x=>x.id===id);
  if(!o)return;
  const step=Math.max(0.5,(o.meta.fanSpeed||1)*0.5);
  const targetIds=o.meta.pxrTargetIds||[];
  const startPos=o.meta.pxrStartPos||{};
  if(targetIds.length===0)return;

  o.meta.pxrPhase='pull';
  renderObj(o);

  let lastTime=0;
  function tick(ts){
    if(!pxrAnims[id])return;
    if(ts-lastTime<33){pxrAnims[id]=requestAnimationFrame(tick);return;}
    lastTime=ts;

    let allDone=true;
    targetIds.forEach(tid=>{
      const cur=objects.find(x=>x.id===tid);if(!cur)return;
      const sp=startPos[tid];if(!sp)return;
      const dx=sp.x-cur.x, dy=sp.y-cur.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<=step){
        cur.x=sp.x;cur.y=sp.y;
      }else{
        cur.x+=dx/dist*step;
        cur.y+=dy/dist*step;
        allDone=false;
      }
      const el=document.getElementById('obj-'+tid);
      if(el){el.style.left=cur.x+'px';el.style.top=cur.y+'px';}
    });

    if(allDone){
      cancelAnimationFrame(pxrAnims[id]);delete pxrAnims[id];
      const pxr=objects.find(x=>x.id===id);
      if(pxr){pxr.meta.pxrPhase='idle';renderObj(pxr);}
      redrawWires();
      return;
    }
    pxrAnims[id]=requestAnimationFrame(tick);
  }
  pxrAnims[id]=requestAnimationFrame(tick);
}

function stopPXR(id){
  if(pxrAnims[id]){cancelAnimationFrame(pxrAnims[id]);delete pxrAnims[id];}
  const o=objects.find(x=>x.id===id);
  if(o){o.meta.pxrPhase='idle';renderObj(o);}
}

function getObjectsInFront(fan){
  const dir=fan.meta.fanDir||'right';
  const reach=fan.meta.fanReach||200; // насколько далеко дует
  return objects.filter(o2=>{
    if(o2.id===fan.id)return false;
    // объект должен быть перед вентилятором по направлению
    // и в пределах ширины вентилятора по перпендикулярной оси
    if(dir==='right'){
      return o2.x>fan.x+fan.w-10
        &&o2.x<fan.x+fan.w+reach
        &&o2.y+o2.h>fan.y&&o2.y<fan.y+fan.h;
    }else if(dir==='left'){
      return o2.x+o2.w<fan.x+10
        &&o2.x+o2.w>fan.x-reach
        &&o2.y+o2.h>fan.y&&o2.y<fan.y+fan.h;
    }else if(dir==='down'){
      return o2.y>fan.y+fan.h-10
        &&o2.y<fan.y+fan.h+reach
        &&o2.x+o2.w>fan.x&&o2.x<fan.x+fan.w;
    }else if(dir==='up'){
      return o2.y+o2.h<fan.y+10
        &&o2.y+o2.h>fan.y-reach
        &&o2.x+o2.w>fan.x&&o2.x<fan.x+fan.w;
    }
    return false;
  });
}

function doPistonPush(piston,sticky){
  const dir=piston.flipped?-1:1;
  const pushEdge=piston.flipped?piston.x:(piston.x+piston.w);
  const dist=piston.w*0.38;
  objects.forEach(o2=>{
    if(o2.id===piston.id)return;
    const inFront=piston.flipped?(o2.x<pushEdge+10&&o2.x+o2.w>pushEdge-dist):(o2.x<pushEdge+dist&&o2.x+o2.w>pushEdge-10);
    const vOver=o2.y<piston.y+piston.h&&o2.y+o2.h>piston.y;
    if(inFront&&vOver){
      o2.x+=dir*dist;
      if(sticky)o2._stickyTarget=piston.id;
      moveGlued(o2);
      const el=document.getElementById('obj-'+o2.id);
      if(el){el.style.left=o2.x+'px';el.style.top=o2.y+'px';}
    }
  });
  redrawWires();
}
function doPistonRetract(piston,sticky){
  if(!sticky)return;
  const dir=piston.flipped?-1:1;const dist=piston.w*0.38;
  objects.forEach(o2=>{
    if(o2._stickyTarget===piston.id){
      o2.x-=dir*dist;delete o2._stickyTarget;
      moveGlued(o2);
      const el=document.getElementById('obj-'+o2.id);
      if(el){el.style.left=o2.x+'px';el.style.top=o2.y+'px';}
    }
  });
  redrawWires();
}

function doEject(ejector){
  const def=ALL_ITEMS_FLAT.find(x=>x.id===ejector.meta.ejectType);if(!def)return;
  const dir=ejector.flipped?-1:1;
  const o={id:nextId++,type:def.id,label:def.label,icon:def.icon||'',
    x:ejector.x+(dir>0?ejector.w+4:-64),y:ejector.y+(ejector.h-50)/2,
    w:50,h:50,active:false,color:'#fff',borderColor:'#000',flipped:false,rotation:0,meta:{},_gox:0,_goy:0};
  objects.push(o);renderObj(o);updateSt();addSpawnCount(1);
  let step=0;const fly=70*dir;
  const anim=setInterval(()=>{step++;o.x+=fly/12;const el=document.getElementById('obj-'+o.id);if(el)el.style.left=o.x+'px';if(step>=12)clearInterval(anim);},16);
}

function handleRobotCmd(robot,srcType,val){
  if(!val)return;
  const step=robot.meta.customSpeed||ROBOT_STEP;
  let dx=0,dy=0,ds=0;
  if(srcType==='ROB_FWD')dy=-step;else if(srcType==='ROB_BCK')dy=step;
  else if(srcType==='ROB_L')dx=-step;else if(srcType==='ROB_R')dx=step;
  else if(srcType==='ROB_BIG')ds=ROBOT_SCALE;else if(srcType==='ROB_SML')ds=-ROBOT_SCALE;
  else return;
  const steps=6;let count=0;
  if(robotAnims[robot.id])clearInterval(robotAnims[robot.id]);
  robotAnims[robot.id]=setInterval(()=>{
    count++;robot.x+=dx/steps;robot.y+=dy/steps;
    if(ds){robot.w=Math.max(30,robot.w+ds/steps);robot.h=Math.max(26,robot.h+ds/steps);}
    moveGlued(robot);
    const el=document.getElementById('obj-'+robot.id);
    if(el){el.style.left=robot.x+'px';el.style.top=robot.y+'px';el.style.width=robot.w+'px';el.style.height=robot.h+'px';}
    redrawWires();
    if(count>=steps){clearInterval(robotAnims[robot.id]);delete robotAnims[robot.id];renderObj(robot);redrawWires();}
  },16);
}

function handleWire(o){
  if(!wireStart){wireStart=o;document.getElementById('obj-'+o.id).classList.add('selected');setMsg('Кликни второй объект...');}
  else{
    if(wireStart.id===o.id){wireStart=null;clearSel();setMsg('');return;}
    if(!wires.find(w=>w.from===wireStart.id&&w.to===o.id)){saveH();wires.push({id:nextId++,from:wireStart.id,to:o.id});redrawWires();updateSt();}
    wireStart=null;clearSel();setMsg('');
  }
}
function redrawWires(){
  const svg=document.getElementById('wire-svg'),wrap=document.getElementById('canvas-wrap');
  svg.setAttribute('width',wrap.clientWidth);svg.setAttribute('height',wrap.clientHeight);
  svg.innerHTML='';
  wires.forEach(w=>{
    const a=objects.find(o=>o.id===w.from),b=objects.find(o=>o.id===w.to);if(!a||!b)return;
    const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
    const col=a.active?'#e53935':'#000';const ddx=(bx-ax)*.5;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${ax},${ay} C${ax+ddx},${ay} ${bx-ddx},${by} ${bx},${by}`);
    path.setAttribute('stroke',col);path.setAttribute('stroke-width',a.active?2.5:1.5);
    path.setAttribute('fill','none');path.setAttribute('stroke-dasharray',a.active?'':'5 4');
    path.style.cursor='pointer';
    path.style.pointerEvents='stroke';
    path.setAttribute('stroke-width',a.active?5:8);
    const pathVis=document.createElementNS('http://www.w3.org/2000/svg','path');
    pathVis.setAttribute('d',`M${ax},${ay} C${ax+ddx},${ay} ${bx-ddx},${by} ${bx},${by}`);
    pathVis.setAttribute('stroke',col);pathVis.setAttribute('stroke-width',a.active?2.5:1.5);
    pathVis.setAttribute('fill','none');pathVis.setAttribute('stroke-dasharray',a.active?'':'5 4');
    pathVis.style.pointerEvents='none';
    path.setAttribute('stroke','transparent');
    path.setAttribute('fill','none');
    path.setAttribute('stroke-dasharray','');
    path.addEventListener('click',e=>{e.stopPropagation();if(tool==='scissors'){saveH();wires=wires.filter(x=>x.id!==w.id);redrawWires();updateSt();}});
    const ang=Math.atan2(by-ay,bx-ax);const hx=bx-Math.cos(ang)*12,hy=by-Math.sin(ang)*12;
    const arr=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arr.setAttribute('points',`${bx},${by} ${hx+Math.cos(ang-2.4)*9},${hy+Math.sin(ang-2.4)*9} ${hx+Math.cos(ang+2.4)*9},${hy+Math.sin(ang+2.4)*9}`);
    arr.setAttribute('fill',col);svg.appendChild(path);svg.appendChild(pathVis);svg.appendChild(arr);
  });
  if(!hideGlue){
    glueGroups.forEach(g=>{
      for(let i=0;i<g.length-1;i++){
        const a=objects.find(o=>o.id===g[i]),b=objects.find(o=>o.id===g[i+1]);
        if(!a||!b)continue;
        const ax=a.x+a.w/2,ay=a.y+a.h/2,bx=b.x+b.w/2,by=b.y+b.h/2;
        const gl=document.createElementNS('http://www.w3.org/2000/svg','line');
        gl.setAttribute('x1',ax);gl.setAttribute('y1',ay);
        gl.setAttribute('x2',bx);gl.setAttribute('y2',by);
        gl.setAttribute('stroke','#8B4513');gl.setAttribute('stroke-width','2');
        gl.setAttribute('stroke-dasharray','6 3');
        gl.style.pointerEvents='none';
        svg.appendChild(gl);
      }
    });
  }
  if(hideWires){
    svg.querySelectorAll('path,polygon').forEach(el=>{el.style.display='none';});
  }
  if(hideGlue){
    svg.querySelectorAll('line').forEach(el=>{el.style.display='none';});
  }
  svg.style.pointerEvents=tool==='scissors'?'all':'none';
}

function handleGlue(o){
  if(!wireStart){wireStart=o;document.getElementById('obj-'+o.id).classList.add('selected');setMsg('Кликни второй объект...');}
  else{
    if(wireStart.id===o.id){wireStart=null;clearSel();setMsg('');return;}
    saveH();
    o._gox=o.x-wireStart.x;
    o._goy=o.y-wireStart.y;
    wireStart._gox=0;wireStart._goy=0;
    let g=glueGroups.find(x=>x.includes(wireStart.id)||x.includes(o.id));
    if(g){
      if(!g.includes(wireStart.id))g.push(wireStart.id);
      if(!g.includes(o.id))g.push(o.id);
    }else{
      glueGroups.push([wireStart.id,o.id]);
    }
    const anchor=objects.find(x=>x.id===wireStart.id);
    if(anchor){
      g=glueGroups.find(x=>x.includes(wireStart.id));
      if(g) g.forEach(id=>{
        const oo=objects.find(x=>x.id===id);
        if(oo&&id!==wireStart.id){oo._gox=oo.x-anchor.x;oo._goy=oo.y-anchor.y;}
        else if(oo){oo._gox=0;oo._goy=0;}
      });
    }
    wireStart=null;clearSel();setMsg('Склеено');setTimeout(()=>setMsg(''),1200);
  }
}

function delObj(id){
  var _ro=document.getElementById('obj-'+id);if(_ro)_ro.remove();
  var _rr=document.getElementById('ring-'+id);if(_rr)_rr.remove();
  var _rc=document.getElementById('camSq-'+id);if(_rc)_rc.remove();
  var _ra=document.getElementById('aud-'+id);if(_ra)_ra.remove();
  objects=objects.filter(o=>o.id!==id);wires=wires.filter(w=>w.from!==id&&w.to!==id);
  if(timers[id]){clearInterval(timers[id]);delete timers[id];}
  if(robotAnims[id]){clearInterval(robotAnims[id]);delete robotAnims[id];}
  if(motorAnims[id]){clearInterval(motorAnims[id]);delete motorAnims[id];}
  if(fanAnims[id]){clearInterval(fanAnims[id]);delete fanAnims[id];}
  if(pxrAnims[id]){cancelAnimationFrame(pxrAnims[id]);delete pxrAnims[id];}
  if(infdTimers[id]){clearInterval(infdTimers[id]);delete infdTimers[id];}
  if(delayTimers[id]){clearTimeout(delayTimers[id]);delete delayTimers[id];}
  delete spstHeld[id];
  glueGroups=glueGroups.map(g=>g.filter(x=>x!==id)).filter(g=>g.length>1);
  redrawWires();updateSt();
}

let resizeTarget=null;
function openResize(o){
  resizeTarget=o;
  document.getElementById('resize-overlay').classList.add('show');
  updateResizeHandles();
}
function closeResize(){
  resizeTarget=null;
  document.getElementById('resize-overlay').classList.remove('show');
}
function updateResizeHandles(){
  if(!resizeTarget)return;
  const o=resizeTarget;
  const wrap=document.getElementById('canvas-wrap');
  const wr=wrap.getBoundingClientRect();
  const cx=wr.left+o.x*zoomLevel+mapOffX+o.w*zoomLevel/2;
  const cy=wr.top+o.y*zoomLevel+mapOffY+o.h*zoomLevel/2;
  const hw=o.w*zoomLevel/2;
  const hh=o.h*zoomLevel/2;
  document.getElementById('rh-left').style.cssText+=`;left:${cx-hw}px;top:${cy}px;`;
  document.getElementById('rh-right').style.cssText+=`;left:${cx+hw}px;top:${cy}px;`;
  document.getElementById('rh-top').style.cssText+=`;left:${cx}px;top:${cy-hh}px;`;
  document.getElementById('rh-bottom').style.cssText+=`;left:${cx}px;top:${cy+hh}px;`;
  const lbl=document.getElementById('resize-label');
  lbl.style.left=(cx-hw)+'px';lbl.style.top=(cy+hh+12)+'px';
  lbl.textContent=`${Math.round(o.w)} × ${Math.round(o.h)}`;
}
function setupResizeOverlay(){
  ['rh-left','rh-right','rh-top','rh-bottom'].forEach(id=>{
    const el=document.getElementById(id);
    let startX=0,startY=0,startW=0,startH=0,startOx=0,startOy=0;
    el.addEventListener('pointerdown',e=>{
      e.stopPropagation();e.preventDefault();
      el.setPointerCapture(e.pointerId);
      startX=e.clientX;startY=e.clientY;
      startW=resizeTarget.w;startH=resizeTarget.h;
      startOx=resizeTarget.x;startOy=resizeTarget.y;
    });
    el.addEventListener('pointermove',e=>{
      if(!el.hasPointerCapture(e.pointerId)||!resizeTarget)return;
      const dx=(e.clientX-startX)/zoomLevel;
      const dy=(e.clientY-startY)/zoomLevel;
      saveH();
      if(id==='rh-right'){resizeTarget.w=Math.max(30,startW+dx);}
      else if(id==='rh-left'){const nw=Math.max(30,startW-dx);resizeTarget.x=startOx+(startW-nw);resizeTarget.w=nw;}
      else if(id==='rh-bottom'){resizeTarget.h=Math.max(20,startH+dy);}
      else if(id==='rh-top'){const nh=Math.max(20,startH-dy);resizeTarget.y=startOy+(startH-nh);resizeTarget.h=nh;}
      const el2=document.getElementById('obj-'+resizeTarget.id);
      if(el2){el2.style.width=resizeTarget.w+'px';el2.style.height=resizeTarget.h+'px';el2.style.left=resizeTarget.x+'px';el2.style.top=resizeTarget.y+'px';}
      updateResizeHandles();redrawWires();
    });
    el.addEventListener('pointerup',()=>{renderObj(resizeTarget);});
  });
  // Клик вне ручек закрывает
  document.getElementById('resize-overlay').addEventListener('pointerdown',e=>{
    if(e.target.id==='resize-overlay')closeResize();
  });
}
function openPaint(o,e){
  paintTarget=o;
  document.getElementById('cpf').classList.toggle('show');
}
function setupCP(){
  PAL.forEach(c=>{
    const s=document.createElement('div');s.className='csw';s.style.background=c;
    s.onclick=()=>{if(paintTarget){saveH();paintTarget.color=c;paintTarget.borderColor=isLight(c)?'#000':'#fff';renderObj(paintTarget);paintTarget=null;document.getElementById('cpf').classList.remove('show');}};
    document.getElementById('swatches').appendChild(s);
  });
  const cust=document.getElementById('cust');
  cust.addEventListener('input',e=>{if(paintTarget){paintTarget.color=e.target.value;paintTarget.borderColor=isLight(e.target.value)?'#000':'#fff';renderObj(paintTarget);}});
  cust.addEventListener('change',()=>{if(paintTarget){saveH();document.getElementById('cpf').classList.remove('show');paintTarget=null;}});
}
function setupRotateSlider(){
  const slider=document.getElementById('rot-slider'),val=document.getElementById('rot-val');
  slider.addEventListener('input',()=>{
    if(!rotateTarget)return;
    rotateTarget.rotation=parseInt(slider.value);
    val.textContent=slider.value+'°';
    renderObj(rotateTarget);
  });
}
function openRotate(o,e){
  rotateTarget=o;
  const panel=document.getElementById('rotate-slider-panel');
  panel.style.left=(e.clientX+8)+'px';panel.style.top=(e.clientY+8)+'px';
  document.getElementById('rot-slider').value=o.rotation||0;
  document.getElementById('rot-val').textContent=(o.rotation||0)+'°';
  panel.classList.toggle('show');
}
function showModal(){document.getElementById('modal-overlay').classList.add('show');}
function hideModal(){document.getElementById('modal-overlay').classList.remove('show');}

function saveH(){
  const s=JSON.stringify({objects:objects.map(o=>({...o,meta:{...o.meta}})),wires:[...wires]});
  hist=hist.slice(0,histIdx+1);hist.push(s);if(hist.length>80)hist.shift();histIdx=hist.length-1;
}
function undo(){if(histIdx<=0)return;histIdx--;restoreH(hist[histIdx]);}
function redo(){if(histIdx>=hist.length-1)return;histIdx++;restoreH(hist[histIdx]);}
function restoreH(s){
  const d=JSON.parse(s);
  document.getElementById('canvas').innerHTML='';document.getElementById('wire-svg').innerHTML='';
  document.querySelectorAll('audio[id^="aud-"]').forEach(a=>a.remove());
  Object.keys(timers).forEach(id=>{clearInterval(timers[id]);delete timers[id];});
  Object.keys(robotAnims).forEach(id=>{clearInterval(robotAnims[id]);delete robotAnims[id];});
  Object.keys(motorAnims).forEach(id=>{clearInterval(motorAnims[id]);delete motorAnims[id];});
  Object.keys(fanAnims).forEach(id=>{clearInterval(fanAnims[id]);delete fanAnims[id];});
  Object.keys(pxrAnims).forEach(id=>{cancelAnimationFrame(pxrAnims[id]);delete pxrAnims[id];});
  Object.keys(infdTimers).forEach(id=>{clearInterval(infdTimers[id]);delete infdTimers[id];});
  Object.keys(delayTimers).forEach(id=>{clearTimeout(delayTimers[id]);delete delayTimers[id];});
  objects=d.objects;wires=d.wires;
  nextId=Math.max(nextId,...objects.map(o=>o.id+1),...wires.map(w=>w.id+1),1);
  objects.forEach(o=>renderObj(o));redrawWires();updateSt();
}
function updateSt(){
  document.getElementById('st-obj').textContent=objects.length;
  document.getElementById('st-wir').textContent=wires.length;
  const trCount=objects.filter(o=>['MOVE','ALPHA','ROTATE_T','COLOR_T','BM','BIG_T','MINI_T','BG','TRIG_DELETE','TRIG_SPAWN','TRIG_CLONE'].includes(o.type)).length;
  const glCount=glueGroups.reduce((s,g)=>s+g.length,0);
  const stEl=document.getElementById('st-info');
  if(stEl)stEl.innerHTML=`Объектов: <b id="st-obj">${objects.length}</b> &nbsp; Проводов: <b id="st-wir">${wires.length}</b> &nbsp; Триггеров: <b>${trCount}</b> &nbsp; Склеенных: <b>${glCount}</b>`;
}
function setMsg(m){document.getElementById('status-msg').textContent=m;}
function clearSel(){document.querySelectorAll('.obj').forEach(e=>e.classList.remove('selected'));}
function isLight(hex){
  if(!hex||hex==='#fff'||hex==='#ffffff')return true;if(hex==='#000'||hex==='#000000')return false;
  try{const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(r*299+g*587+b*114)/1000>128;}catch(e){return true;}
}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escA(s){return String(s).replace(/"/g,'&quot;');}
</script>
